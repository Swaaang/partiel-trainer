   a:1,e:"HEART de Google : Happiness (satisfaction, NPS, SUS), Engagement (intensité d'usage, fréquence), Adoption (nouveaux utilisateurs sur une période), Retention (taux de revenus), Task success (taux de succès, temps, taux d'erreur). Pour chaque dimension, définir Goals → Signals → Metrics."},

  // ─── ACCESSIBILITÉ (10) ──────────────────────────────────────────
  {id:241,t:"ac",d:"f",
   q:"Les WCAG (Web Content Accessibility Guidelines) définissent des niveaux de conformité progressifs. Lesquels sont les trois niveaux officiels ?",
   o:["Bronze, Argent, Or","Niveau 1, Niveau 2, Niveau 3","A (minimum), AA (recommandé), AAA (élevé)","Beginner, Intermediate, Expert"],
   a:2,e:"WCAG (W3C) définit 3 niveaux : A (basique, contraste 3:1, alternatives textuelles), AA (recommandé pour les sites publics, contraste 4.5:1, navigation clavier complète), AAA (le plus exigeant, contraste 7:1, langage simple - rarement atteignable globalement). En France, le RGAA s'aligne sur AA."},

  {id:242,t:"ac",d:"f",
   q:"Quel est le ratio de contraste minimum requis par WCAG AA pour du texte de taille normale (moins de 18px ou 14px en gras) ?",
   o:["3:1","4.5:1","7:1","10:1"],
   a:1,e:"WCAG AA exige un contraste minimum de 4.5:1 pour le texte normal et 3:1 pour le texte large (≥18px ou ≥14px gras). Niveau AAA monte à 7:1 (normal) / 4.5:1 (large). Outils : WebAIM Contrast Checker, Stark, Polypane. À tester sur tous les états (hover, focus, disabled)."},

  {id:243,t:"ac",d:"f",
   q:"Quelle taille minimale recommandent les Apple Human Interface Guidelines et le Material Design pour les zones interactives (touch targets) sur mobile ?",
   o:["24x24 points","36x36 points","44x44 points (Apple) / 48x48dp (Material)","60x60 points"],
   a:2,e:"Apple HIG : 44pt × 44pt minimum. Google Material : 48dp × 48dp minimum. WCAG 2.5.5 recommande 44x44 CSS pixels en niveau AAA. Cette taille correspond au pulpe du doigt humain moyen. Si l'élément visuel est plus petit, ajouter du padding invisible pour étendre la zone de tap."},

  {id:244,t:"ac",d:"f",
   q:"Pour qu'une image décorative ne soit pas annoncée par les lecteurs d'écran, quelle valeur d'attribut alt faut-il utiliser en HTML ?",
   o:["alt=\"décoratif\"","alt=\"\" (alt vide)","alt=\"none\"","Ne pas mettre d'attribut alt du tout"],
   a:1,e:"alt=\"\" (vide) signale aux lecteurs d'écran que l'image est purement décorative et doit être ignorée. Ne PAS omettre l'attribut alt (le lecteur d'écran lirait alors le nom du fichier). Pour les images informatives : alt descriptif. Pour les icônes fonctionnelles : alt décrivant l'action ('Fermer', pas 'Croix')."},

  {id:245,t:"ac",d:"m",
   q:"Vous concevez une interface où l'utilisateur doit pouvoir naviguer sans souris (au clavier ou avec un lecteur d'écran). Quel style CSS NE faut-il SURTOUT PAS appliquer globalement ?",
   o:["margin: 0; padding: 0;","outline: none; (suppression de l'indicateur de focus)","color: black; sur tout le texte","font-family: sans-serif;"],
   a:1,e:"`outline: none;` supprime l'indicateur de focus visible, rendant l'interface inutilisable au clavier. WCAG 2.4.7 exige un focus visible. Si on doit le styler différemment, le remplacer par un autre style accessible (ex: `:focus-visible { outline: 2px solid #007acc; }`). Sinon, l'utilisateur 'perd' où il est."},

  {id:246,t:"ac",d:"m",
   q:"Quel est le rôle principal des attributs ARIA (Accessible Rich Internet Applications) en HTML ?",
   o:["Améliorer le SEO et le référencement Google","Apporter aux technologies d'assistance (lecteurs d'écran) une sémantique manquante quand les éléments HTML natifs ne suffisent pas","Remplacer le HTML standard par une syntaxe plus moderne","Encoder les images en base64 dans le HTML"],
   a:1,e:"Les attributs ARIA (role, aria-label, aria-expanded, aria-live, etc.) enrichissent la sémantique pour les technologies d'assistance. Règle d'or (1ère règle ARIA) : 'Don't use ARIA' si un élément HTML natif fait l'affaire (un `<button>` vaut mieux qu'une `<div role=\"button\">`)."},

  {id:247,t:"ac",d:"m",
   q:"Une bonne hiérarchie de titres HTML (h1, h2, h3...) est essentielle pour l'accessibilité. Pourquoi ?",
   o:["Pour le SEO uniquement, c'est sans impact pour l'accessibilité","Les utilisateurs de lecteurs d'écran naviguent souvent par les titres pour explorer la structure d'une page (jusqu'à 70% selon WebAIM)","Pour respecter la grille de design","Pour optimiser le poids du HTML"],
   a:1,e:"Selon WebAIM, ~70% des utilisateurs de lecteurs d'écran naviguent par les titres (h1, h2...). Une page avec une hiérarchie claire et logique (un seul h1, h2 pour les sections, pas de saut de niveau) est navigable. Sans cette structure, l'utilisateur doit lire ligne à ligne. C'est aussi essentiel pour le SEO, mais l'accessibilité prime."},

  {id:248,t:"ac",d:"h",
   q:"En France, le RGAA (Référentiel Général d'Amélioration de l'Accessibilité) est obligatoire pour quels types d'organisations depuis la loi de 2005 et ses évolutions ?",
   o:["Uniquement les sites du gouvernement central","Les services publics, collectivités, et entreprises privées ayant un CA supérieur à 250M€","Toutes les entreprises sans exception","Uniquement les sites e-commerce"],
   a:1,e:"Loi du 11 février 2005 + transposition de la directive UE 2016/2102 : obligation pour les services de l'État, collectivités, établissements publics, ET entreprises privées au CA > 250M€ (depuis 2019). Sanction : amende jusqu'à 50 000€/an. Le RGAA s'aligne sur WCAG AA. La déclaration de conformité doit être publiée sur le site."},

  {id:249,t:"ac",d:"h",
   q:"Le concept de 'design universel' (Universal Design) ou 'design inclusif' va plus loin que la simple accessibilité. En quoi consiste-t-il ?",
   o:["Concevoir des interfaces qui n'incluent que les utilisateurs handicapés","Concevoir d'emblée des produits utilisables par le plus grand nombre, indépendamment des capacités, sans avoir besoin d'adaptation a posteriori","Adapter chaque interface au profil d'un utilisateur précis","Suivre uniquement les WCAG niveau A"],
   a:1,e:"Universal Design (Ronald Mace, 1985) : concevoir d'emblée pour la diversité humaine, pas adapter après coup. Les 7 principes : utilisation équitable, flexibilité, simplicité, information perceptible, tolérance à l'erreur, peu d'effort physique, taille/espace adaptés. Les 'curb cuts' (rampes de trottoir) profitent à tous, pas qu'aux handicapés."},

  {id:250,t:"ac",d:"h",
   q:"Le contraste seul ne suffit pas pour communiquer une information. Quel principe WCAG fondamental cela illustre-t-il ?",
   o:["Ne jamais utiliser la couleur","Ne pas utiliser la couleur comme seul moyen de transmettre une information (ex: 'cliquez sur le bouton rouge') - utiliser un second indicateur (icône, texte, soulignement)","Utiliser uniquement des couleurs achromatiques (noir/blanc/gris)","Maximiser le contraste à 21:1 partout"],
   a:1,e:"WCAG 1.4.1 (Use of Color) : la couleur ne doit pas être le seul moyen véhiculant une information. Critique pour les daltoniens (~8% des hommes) et utilisateurs de lecteurs d'écran. Mauvais : 'champ obligatoire en rouge'. Bon : rouge + astérisque + label 'Obligatoire'. Mauvais : 'lien en bleu'. Bon : bleu + souligné."},

  // ─── PROCESS & PATTERNS (10) ─────────────────────────────────────
  {id:251,t:"pa",d:"f",
   q:"Le Double Diamond, formalisé par le Design Council britannique en 2005, est un cadre de processus de design. Quelles sont ses 4 phases dans l'ordre ?",
   o:["Recherche, Brainstorming, Maquette, Test","Discover (divergence), Define (convergence), Develop (divergence), Deliver (convergence)","Empathize, Ideate, Build, Ship","Plan, Design, Code, Launch"],
   a:1,e:"Le Double Diamond du Design Council : 1) Discover (recherche utilisateur, divergence), 2) Define (synthèse du problème, convergence), 3) Develop (idéation et prototypage, divergence), 4) Deliver (test et livraison, convergence). Le 1er diamant = 'résoudre le BON problème', le 2nd = 'résoudre le problème CORRECTEMENT'."},

  {id:252,t:"pa",d:"f",
   q:"Le Design Thinking, popularisé par IDEO et la d.school de Stanford, suit traditionnellement 5 étapes. Lesquelles ?",
   o:["Empathize, Define, Ideate, Prototype, Test","Plan, Design, Build, Test, Launch","Research, Wireframe, Mockup, Code, Deploy","Analyse, Idéation, Prototypage, Test, Documentation"],
   a:0,e:"Design Thinking d.school Stanford : 1) Empathize (comprendre les utilisateurs), 2) Define (définir le problème), 3) Ideate (générer des idées sans censure), 4) Prototype (matérialiser rapidement), 5) Test (valider avec de vrais utilisateurs). Itératif, non linéaire : on peut revenir en arrière à tout moment selon ce qu'on apprend."},

  {id:253,t:"pa",d:"f",
   q:"Quelle est la différence essentielle entre un wireframe et un mockup en design d'interface ?",
   o:["Le wireframe est en couleur, le mockup en noir et blanc","Le wireframe se concentre sur la structure et la disposition (souvent en niveaux de gris) ; le mockup ajoute le design visuel final (couleurs, typographies, images)","Le wireframe est interactif, le mockup statique","Il n'y a aucune différence, ce sont des synonymes"],
   a:1,e:"Wireframe : focus sur la structure, le contenu, la disposition - souvent en niveaux de gris pour ne pas se laisser distraire par l'esthétique (low-fidelity). Mockup : design visuel final avec couleurs, typo, images, états (high-fidelity). Prototype : ajoute l'interactivité (clics, transitions). Progression : wireframe → mockup → prototype."},

  {id:254,t:"pa",d:"m",
   q:"Le concept de MVP (Minimum Viable Product) est central dans la méthodologie Lean Startup d'Eric Ries. Quel est son objectif principal ?",
   o:["Lancer le produit le plus complet possible dès le début pour impressionner les investisseurs","Lancer une version minimaliste mais fonctionnelle pour valider rapidement les hypothèses produit avec de vrais utilisateurs (Build-Measure-Learn)","Réduire les coûts de développement à zéro","Ne lancer le produit qu'une fois 100% parfait"],
   a:1,e:"MVP (Eric Ries, Lean Startup) : la version la plus minimale qui permet de tester une hypothèse produit avec de vrais utilisateurs. Objectif : maximiser l'apprentissage validé, pas la fonctionnalité. Cycle Build-Measure-Learn. Erreur courante : confondre MVP avec 'produit pas fini' au lieu de 'expérience minimale fonctionnelle'."},

  {id:255,t:"pa",d:"m",
   q:"Vous avez le choix entre placer la navigation principale dans un 'hamburger menu' caché ou dans une 'bottom navigation bar' visible. Pour une app mobile avec 4 sections principales très utilisées, quel pattern privilégier ?",

function h(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function pct(n,t){return t>0?Math.round(n/t*100):0;}
function scoreColor(p){return p>=70?"#2D9B6E":p>=50?"#F59E0B":"#E0344A";}
function getLv(xp){return[...LEVELS].reverse().find(l=>xp>=l.min)||LEVELS[0];}
function getNextLv(xp){return LEVELS.find(l=>l.min>xp);}
function subData(id){return D.subs[id]||(D.subs[id]={seen:[],ts:{}});}

function selectQ(sub,cfg){
  let pool=sub.questions.filter(q=>cfg.themes.includes(q.t)&&(cfg.diff==="x"||q.d===cfg.diff));
  if(!pool.length)pool=sub.questions.filter(q=>cfg.themes.includes(q.t));
  const sd=subData(sub.id);
  const scored=pool.map(q=>{
    const key=sub.themes.find(t=>t.id===q.t);
    const lab=key?key.label:q.t;
    const ts=sd.ts[lab]||{c:0,n:0};
    const weak=ts.n>0?1-(ts.c/ts.n)*0.5:0.8;
    const fresh=sd.seen.includes(q.id)?0.3:1;
    return{q,s:fresh*weak+Math.random()*.25};
  });
  return scored.sort((a,b)=>b.s-a.s).slice(0,cfg.count).map(x=>x.q).sort(()=>Math.random()-.5);
}

function getWeak(){
  let worst=null,worstP=1;
  SUBJECTS.forEach(sub=>{
    const sd=subData(sub.id);
    sub.themes.forEach(t=>{
      const ts=sd.ts[t.label];
      if(ts&&ts.n>=4){const p=ts.c/ts.n;if(p<worstP){worstP=p;worst={sub,tid:t.id,label:t.label,pct:Math.round(p*100)};}}
    });
  });
  return worst;
}

  if(Q.rev)return;
  Q.sel=idx;haptic(8);render();

  if(Q.sel===null||Q.rev)return;
  Q.rev=true;
  const correct=Q.sel===Q.qs[Q.cur].a;
  haptic(correct?[20]:[40,60,40]);
  render();
};
window.next=function(){
  if(!Q.rev)return;
  const q=Q.qs[Q.cur];
  Q.ans.push({theme:q.t,correct:Q.sel===q.a});
  if(Q.cur+1<Q.qs.length){
    const qc=document.getElementById("qcard");
    if(qc){qc.style.cssText="transition:opacity .15s,transform .15s;opacity:0;transform:translateX(14px)";}
    setTimeout(()=>{Q.cur++;Q.sel=null;Q.rev=false;render();},160);
  } else {
    finishSession();
  }
};
window.toggleTheme=function(tid){
  const t=Q.cfg.themes;
  Q.cfg.themes=t.includes(tid)?(t.length>1?t.filter(x=>x!==tid):t):[...t,tid];

};

window.setCount=function(n){Q.cfg.count=n;render();};

};
window.resetStats=function(){
  if(!confirm("Réinitialiser toutes vos statistiques ?\n\nCette action est irréversible."))return;
  if(!confirm("Vraiment ? Toute votre progression sera perdue."))return;
  D=JSON.parse(JSON.stringify(DEF));save();go("hub",true);
};

function finishSession(){
  const scoreN=Q.ans.filter(a=>a.correct).length;
  const xpG=scoreN*10+(scoreN/Q.qs.length>=.8?50:0);
  const today=new Date().toDateString();
  const yest=new Date(Date.now()-86400000).toDateString();
  const newStreak=D.lastDate===today?D.streak:D.lastDate===yest?D.streak+1:1;
  const sub=Q.sub;const sd=subData(sub.id);
  const newSeen=[...new Set([...sd.seen,...Q.qs.map(q=>q.id)])];
  const allIds=sub.questions.filter(q=>Q.cfg.themes.includes(q.t)).map(q=>q.id);
  sd.seen=allIds.every(id=>newSeen.includes(id))?[]:newSeen;
  Q.ans.forEach(a=>{
    const key=sub.themes.find(t=>t.id===a.theme);
    const lab=key?key.label:a.theme;
    if(!sd.ts[lab])sd.ts[lab]={c:0,n:0};
    sd.ts[lab].n++;if(a.correct)sd.ts[lab].c++;
  });
  const session={sub:sub.id,date:new Date().toISOString(),score:scoreN,total:Q.qs.length};
  D.sessions=[...D.sessions.slice(-99),session];
  D.xp+=xpG;D.streak=newStreak;D.lastDate=today;D.n++;
  const earnedIds=BADGES.filter(b=>!D.badges.includes(b.id)&&b.ok(D,D.sessions)).map(b=>b.id);
  D.badges=[...D.badges,...earnedIds];
  Q.newBadges=BADGES.filter(b=>earnedIds.includes(b.id));
  Q.earned=xpG;save();go("results");
}

function buildFavicon(){
  try{
    const c=document.createElement("canvas");c.width=c.height=192;
    const ctx=c.getContext("2d");
    const g=ctx.createLinearGradient(0,0,192,192);
    g.addColorStop(0,"#1A1830");g.addColorStop(1,"#0D0D12");
    ctx.fillStyle=g;
    const r=44,x=0,y=0,w=192,hh=192;
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+hh-r);ctx.arcTo(x+w,y+hh,x+w-r,y+hh,r);
    ctx.lineTo(x+r,y+hh);ctx.arcTo(x,y+hh,x,y+hh-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.fill();
    const gc=ctx.createLinearGradient(30,30,162,162);
    gc.addColorStop(0,"#C9A84C");gc.addColorStop(1,"#E0B85C");
    ctx.strokeStyle=gc;ctx.lineWidth=14;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(96,96,52,-.5*Math.PI,1.5*Math.PI*.75);ctx.stroke();
    ctx.fillStyle="#F0EDE8";ctx.font="bold 72px 'DM Sans',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("E",96,100);
    const url=c.toDataURL();
    ["icon","apple-touch-icon","shortcut icon"].forEach(rel=>{
      const l=document.createElement("link");l.rel=rel;l.href=url;
      document.head.appendChild(l);
    });
  }catch(e){}
}

function progressBars(sd,sub){
  const keys=Object.keys(sd.ts);if(!keys.length)return"";
  return sub.themes.filter(t=>sd.ts[t.label]).map(t=>{
    const ts=sd.ts[t.label];const p=pct(ts.c,ts.n);
    return`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:13px;color:#C5C0D8">${t.emoji} ${h(t.label)}</span>
        <span style="font-size:12px;font-weight:700;color:${scoreColor(p)}">${p}% <span style="color:#44445A;font-weight:400">(${ts.n})</span></span>
      </div>
      <div style="height:4px;background:#1E1E28;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${t.color};border-radius:4px;transition:width .8s ease"></div>
      </div>
    </div>`;
  }).join("");
}

    <div class="stats-row" style="margin-bottom:16px">
      <div class="stat"><div style="font-size:18px">📅</div><div class="stat-n">${totalS}</div><div class="stat-l">Sessions</div></div>
      <div class="stat"><div style="font-size:18px">🎯</div><div class="stat-n">${avgS===null?"—":avgS+"%"}</div><div class="stat-l">Moyenne</div></div>
      <div class="stat"><div style="font-size:18px">🔥</div><div class="stat-n">${D.streak>0?D.streak+"j":"0"}</div><div class="stat-l">Série</div></div>
    </div>`:"";

  const weakSect=weak?`
    <button class="weak-btn" onclick="quickWeak()" style="margin-bottom:16px">
      <div>
        <div style="font-size:11px;font-weight:700;color:#E0344A;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">⚠️ Point faible détecté</div>
        <div style="font-size:14px;font-weight:600;color:#F0EDE8">S'entraîner sur : <strong>${h(weak.label)}</strong></div>
        <div style="font-size:12px;color:#7A7A9A">Score actuel : ${weak.pct}% · Session ciblée</div>
      </div>
      <span style="font-size:22px;color:#E0344A;flex-shrink:0">→</span>
    </button>`:"";

  const subCards=SUBJECTS.map(sub=>{
    const ss=sessions.filter(s=>s.sub===sub.id);
    const a=ss.length?Math.round(avg(ss.map(s=>s.score/s.total*100))):null;
    return`<button class="sub-card" style="border-left-color:${sub.color};margin-bottom:10px" onclick="openSub('${sub.id}')">
      <div class="sub-icon" style="background:${sub.color}18;border:1px solid ${sub.color}30">${sub.emoji}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700;color:#F0EDE8;margin-bottom:4px">${h(sub.title)}</div>
        <div style="font-size:12px;color:#7A7A9A;margin-bottom:8px">${h(sub.sub)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:600;color:${sub.color};background:${sub.color}18;border:1px solid ${sub.color}30;border-radius:8px;padding:2px 8px">${sub.questions.length} questions</span>
          ${ss.length?`<span style="font-size:11px;color:#7A7A9A;background:#1E1E28;border:1px solid #222230;border-radius:8px;padding:2px 8px">${ss.length} sessions</span>`:""}
          ${a===null?"":`<span style="font-size:11px;font-weight:700;color:${scoreColor(a)};background:#1E1E28;border:1px solid #222230;border-radius:8px;padding:2px 8px">${a}%</span>`}
        </div>
      </div>
      <span style="font-size:18px;color:${sub.color};flex-shrink:0">›</span>
    </button>`;
  }).join("");

  const badgeSect=D.badges.length?`
    <div style="margin-top:6px;margin-bottom:16px">
      <p class="eyebrow" style="margin-bottom:10px">Badges</p>
      <div>${BADGES.filter(b=>D.badges.includes(b.id)).map(b=>`<span class="badge">${b.e} ${h(b.l)}</span>`).join("")}</div>
    </div>`:"";

  return`<div class="screen" style="padding-top:16px;padding-bottom:32px">
    <div class="pad" style="margin-bottom:20px">
      <p class="eyebrow" style="margin-bottom:6px">Entraîneur Partiel</p>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div>
          <div class="h1">${lv.e} ${lv.l}</div>
          <div style="font-size:12px;color:#7A7A9A;margin-top:3px">${D.xp} XP${D.streak>0?" · 🔥 "+D.streak+" jour"+(D.streak>1?"s":""):""}</div>
        </div>
      </div>
      <div style="background:#16161F;border:1px solid #222230;border-radius:12px;padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;font-weight:600;color:#C9A84C">${lv.l}</span>
          ${nl?`<span style="font-size:11px;color:#7A7A9A">${nl.min-D.xp} XP → ${nl.l} ${nl.e}</span>`:`<span style="font-size:11px;color:#7A7A9A">Niveau max 🏆</span>`}
        </div>
        <div class="xp-track"><div class="xp-fill" style="width:${xpPct}%"></div></div>
      </div>
    </div>

    <div class="pad">
      ${statsSect}
      ${progSect}
      ${weakSect}
      <p class="eyebrow" style="margin-bottom:12px">Matières</p>
      ${subCards}
      <div class="soon">
        <div style="width:44px;height:44px;border-radius:14px;background:#1E1E28;border:1px solid #222230;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">➕</div>
        <div><div style="font-size:14px;font-weight:600;color:#7A7A9A">Bientôt · Histoire du Design</div><div style="font-size:12px;color:#44445A;margin-top:2px">Nouvelle matière en cours…</div></div>
      </div>
      ${badgeSect}
      ${D.n>0?`<div style="text-align:center;margin-top:20px"><button onclick="resetStats()" style="font-size:12px;color:#44445A;background:none;border:none;cursor:pointer;text-decoration:underline">Réinitialiser les stats</button></div>`:""}
    </div>
  </div>`;
}

function renderSubject(){
  const sub=Q.sub;const sd=subData(sub.id);
  const ss=D.sessions.filter(s=>s.sub===sub.id);
  const a=ss.length?Math.round(avg(ss.map(s=>s.score/s.total*100))):null;
  const best=ss.length?Math.max(...ss.map(s=>Math.round(s.score/s.total*100))):null;

  const themeToggles=sub.themes.map(t=>{
    const on=Q.cfg.themes.includes(t.id);
    return`<button class="t-chip" onclick="toggleTheme('${t.id}')" style="border-color:${on?t.color:"#222230"};background:${on?t.color+"18":"#16161F"};color:${on?t.color:"#7A7A9A"}">
      <span>${t.emoji} ${h(t.label)}</span>
      <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${on?t.color:"#2E2E3E"};background:${on?t.color:"transparent"};display:flex;align-items:center;justify-content:center;font-size:11px;color:#0D0D12;flex-shrink:0">${on?"✓":""}</div>
    </button>`;
  }).join("");

  const diffBtns=[{id:"f",l:"Facile",s:"Définitions"},{id:"m",l:"Moyen",s:"Application"},{id:"h",l:"Difficile",s:"Cas pratiques"},{id:"x",l:"Mixte",s:"Tous niveaux"}].map(d=>`
    <button class="d-chip" onclick="setDiff('${d.id}')" style="border-color:${Q.cfg.diff===d.id?DC[d.id]:"#222230"}">
      <div class="d-chip-label" style="color:${Q.cfg.diff===d.id?DC[d.id]:"#F0EDE8"}">${d.l}</div>
      <div class="d-chip-sub">${d.s}</div>
    </button>`).join("");

  const countBtns=[5,7,10,15].map(n=>`
    <button class="n-chip" onclick="setCount(${n})" style="border-color:${Q.cfg.count===n?sub.color:"#222230"};background:${Q.cfg.count===n?`linear-gradient(135deg,${sub.color},${sub.gto})`:"#16161F"};color:${Q.cfg.count===n?"#0D0D12":"#7A7A9A"}">${n}</button>`).join("");

  return`<div class="screen" style="padding-bottom:32px">
    <div style="background:#1E1E28;border-bottom:1px solid #222230;padding:16px 18px 20px">
      <button class="btn-back" onclick="goHub()">‹ Retour</button>
      <div style="display:flex;align-items:center;gap:14px;margin-top:8px">
        <div class="sub-icon" style="width:52px;height:52px;border-radius:16px;background:${sub.color}20;border:1px solid ${sub.color}40;font-size:26px">${sub.emoji}</div>
        <div>
          <div class="h2">${h(sub.title)}</div>
          <div style="font-size:13px;color:#7A7A9A;margin-top:2px">${h(sub.sub)} · ${sub.questions.length} q</div>
        </div>
      </div>
    </div>

    <div class="pad" style="padding-top:20px">
      ${ss.length?`<div class="stats-row" style="margin-bottom:20px">
        <div class="stat"><div class="stat-n">${ss.length}</div><div class="stat-l">Sessions</div></div>
        <div class="stat"><div class="stat-n">${a===null?"—":a+"%"}</div><div class="stat-l">Moy.</div></div>
        <div class="stat"><div class="stat-n">${best===null?"—":best+"%"}</div><div class="stat-l">Meilleur</div></div>
      </div>`:""}

      ${Object.keys(sd.ts).length?`
      <div class="card" style="padding:16px;margin-bottom:20px">
        <p class="eyebrow" style="margin-bottom:12px">Par thème</p>
        ${progressBars(sd,sub)}
      </div>`:""}

      <div class="card" style="padding:16px;margin-bottom:20px">
        <p class="eyebrow" style="margin-bottom:12px">Thèmes</p>
        <div class="stack" style="margin-bottom:20px">${themeToggles}</div>
        <p class="eyebrow" style="margin-bottom:10px">Difficulté</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">${diffBtns}</div>
        <p class="eyebrow" style="margin-bottom:10px">Questions</p>
        <div style="display:flex;gap:8px">${countBtns}</div>
      </div>

      <button class="btn btn-primary" onclick="startSession()">Commencer →</button>
    </div>
  </div>`;
}

function renderQuiz(){
  const sub=Q.sub,q=Q.qs[Q.cur];
  if(!sub||!q)return"<div class='screen'></div>";
  const tObj=sub.themes.find(t=>t.id===q.t)||sub.themes[0];
  const prog=Math.round(Q.cur/Q.qs.length*100);
  const correctCt=Q.ans.filter(a=>a.correct).length;

  const opts=q.o.map((opt,idx)=>{
    let cls="opt",badge=["A","B","C","D"][idx];
    if(Q.rev){
      if(idx===q.a)        cls="opt correct";
      else if(idx===Q.sel) cls="opt wrong";
      else                 cls="opt faded";
    } else if(Q.sel===idx) cls="opt picked";
    if(Q.rev&&idx===q.a)        badge="✓";
    else if(Q.rev&&idx===Q.sel&&idx!==q.a) badge="✗";
    return`<button class="${cls}" onclick="pickOpt(${idx})" ${Q.rev?"disabled":""}>
      <span class="opt-badge">${badge}</span>
      <span class="opt-label">${h(opt)}</span>
      ${!Q.rev?`<span class="kbd">${idx+1}</span>`:""}
    </button>`;
  }).join("");

  const expl=Q.rev?`<div class="expl ${Q.sel===q.a?"ok":"bad"}">
    <div class="expl-title">${Q.sel===q.a?"✅ Bonne réponse !":"💡 Explication"}</div>
    <div class="expl-body">${h(q.e)}</div>
  </div>`:"";

  const cta=Q.rev
    ?`<button class="btn btn-primary" onclick="next()" style="background:linear-gradient(135deg,${sub.color},${sub.gto})">${Q.cur+1<Q.qs.length?"Question suivante →":"Voir mes résultats 🎯"}</button>`
    :Q.sel!==null
    ?`<button class="btn btn-primary" onclick="validate()">Valider ma réponse ✓</button>`
    :"";

  return`<div class="screen">
    <div class="quiz-bar">
      <div class="quiz-bar-inner">
        <button onclick="goSubject()" aria-label="Quitter" style="font-size:22px;color:#7A7A9A;line-height:1;padding:4px 8px;margin-left:-8px">✕</button>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;font-weight:700;color:#F0EDE8">${Q.cur+1}<span style="color:#44445A"> / ${Q.qs.length}</span></span>
          <span style="width:1px;height:12px;background:#2E2E3E"></span>
          <span style="font-size:13px;font-weight:700;color:#2D9B6E">✓ ${correctCt}</span>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${prog}%;background:${sub.color}"></div>
      </div>
    </div>

    <div class="quiz-content pad">
      <div style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap">
        <span class="tag" style="background:${tObj.color}15;color:${tObj.color};border-color:${tObj.color}30">${tObj.emoji} ${h(tObj.label)}</span>
        <span class="tag" style="background:${DC[q.d]}12;color:${DC[q.d]};border-color:${DC[q.d]}30">${DL[q.d]}</span>
      </div>

      <div id="qcard" class="card" style="padding:16px 18px;margin-bottom:12px;border-left:3px solid ${tObj.color}">
        <p style="font-size:15px;font-weight:500;line-height:1.7;color:#F0EDE8;margin:0">${h(q.q)}</p>
        ${q.img&&SVG_LIB[q.img]?`<div style="margin-top:14px;padding:16px;background:#0D0D12;border-radius:10px;border:1px solid #222230">${SVG_LIB[q.img]}</div>`:""}
      </div>

      <div class="stack" style="margin-bottom:12px">${opts}</div>
      ${expl}
    </div>

    ${cta?`<div class="quiz-cta">${cta}</div>`:`<div style="height:32px"></div>`}
  </div>`;
}

function renderResults(){
  const sub=Q.sub;
  const scoreN=Q.ans.filter(a=>a.correct).length;
  const total=Q.ans.length;
  const p=pct(scoreN,total);
  const g=[{m:90,l:"Excellent",c:"#2D9B6E",e:"🏆"},{m:75,l:"Très bien",c:"#4F46E5",e:"👍"},{m:60,l:"Bien",c:"#F59E0B",e:"📈"},{m:0,l:"À retravailler",c:"#E0344A",e:"💪"}].find(x=>p>=x.m);
  const byTheme=sub.themes.map(t=>{
    const qs=Q.ans.filter(a=>a.theme===t.id);if(!qs.length)return null;
    const c=qs.filter(a=>a.correct).length;return{...t,c,n:qs.length,p:pct(c,qs.length)};
  }).filter(Boolean);
  const histSess=D.sessions.filter(s=>s.sub===sub.id);

  setTimeout(()=>{
    const c=document.getElementById("ring-c");if(!c)return;
    c.width=c.height=140;const ctx=c.getContext("2d");
    ctx.beginPath();ctx.arc(70,70,52,0,Math.PI*2);ctx.strokeStyle="#222230";ctx.lineWidth=12;ctx.stroke();
    if(p>0){
      const gr=ctx.createLinearGradient(0,0,140,140);
      gr.addColorStop(0,"#C9A84C");gr.addColorStop(1,"#E0B85C");
      ctx.beginPath();ctx.arc(70,70,52,-.5*Math.PI,-.5*Math.PI+2*Math.PI*p/100);
      ctx.strokeStyle=gr;ctx.lineWidth=12;ctx.lineCap="round";ctx.stroke();
    }
  },50);

  return`<div class="screen" style="padding-bottom:32px">
    <div style="border-bottom:1px solid #222230;padding:36px 18px 28px;text-align:center">
      <div class="ring-wrap">
        <canvas id="ring-c"></canvas>
        <div class="ring-inner">
          <div class="ring-pct">${p}%</div>
          <div class="ring-sub">${scoreN}/${total}</div>
        </div>
      </div>
      <div style="display:inline-block;background:${g.c};color:#fff;border-radius:20px;padding:6px 20px;font-size:14px;font-weight:700;margin-bottom:14px">${g.e} ${g.l}</div>
      <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:9px 16px;font-size:14px;font-weight:700;color:#C9A84C">✨ +${Q.earned} XP</div>
    </div>

    <div class="pad" style="padding-top:20px">
      ${Q.newBadges.length?`<div class="card" style="padding:16px;margin-bottom:18px;border-color:rgba(201,168,76,.3)">
        <p style="font-size:12px;font-weight:700;color:#C9A84C;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">🎉 Badge débloqué !</p>
        ${Q.newBadges.map(b=>`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px">${b.e}</span><div><div style="font-size:14px;font-weight:700;color:#F0EDE8">${h(b.l)}</div><div style="font-size:12px;color:#7A7A9A">${h(b.d)}</div></div></div>`).join("")}
      </div>`:""}

      ${byTheme.length>1?`<div style="margin-bottom:20px">
        <p class="eyebrow" style="margin-bottom:12px">Par thème</p>
        ${byTheme.map(t=>`<div class="card-sm" style="padding:12px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:13px;color:#C5C0D8">${t.emoji} ${h(t.label)}</span>
            <span style="font-size:13px;font-weight:700;color:${scoreColor(t.p)}">${t.c}/${t.n}</span>
          </div>
          <div style="height:4px;background:#1E1E28;border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${t.p}%;background:${t.color};border-radius:4px"></div>
          </div>
        </div>`).join("")}
      </div>`:""}

      ${histSess.length>1?`<div style="margin-bottom:20px">
        <p class="eyebrow" style="margin-bottom:10px">Historique</p>
        <div class="hist">
          ${histSess.slice(-8).reverse().map((s,i)=>{const p2=Math.round(s.score/s.total*100);return`<div class="hist-box ${i===0?"now":""}">
            <div style="font-size:13px;font-weight:800;color:${scoreColor(p2)}">${p2}%</div>
            <div style="font-size:10px;color:#44445A;margin-top:1px">${s.score}/${s.total}</div>
          </div>`;}).join("")}
        </div>
      </div>`:""}

      <div class="stack">
        <button class="btn btn-primary" style="background:linear-gradient(135deg,${sub.color},${sub.gto})" onclick="startSession()">🔄 Nouvelle session</button>
        <button class="btn btn-soft" onclick="goSubject()">Changer les réglages</button>
        <button class="btn btn-ghost" onclick="goHub()">Accueil</button>
      </div>
    </div>
  </div>`;
}

// =============================================================
// MAIN RENDER
// =============================================================
function render(){
  const el=document.getElementById("app");
  const screens={hub:renderHub,subject:renderSubject,quiz:renderQuiz,results:renderResults};
  el.innerHTML=(screens[Q.screen]||renderHub)();
}

// =============================================================
// KEYBOARD SHORTCUTS
// =============================================================
document.addEventListener("keydown",function(e){
  if(Q.screen!=="quiz")return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key>="1"&&e.key<="4"){
    const idx=parseInt(e.key)-1;
    if(Q.qs[Q.cur]&&idx<Q.qs[Q.cur].o.length){window.pickOpt(idx);e.preventDefault();}
  } else if(e.key==="Enter"){
    if(Q.rev)window.next();
    else if(Q.sel!==null)window.validate();
    e.preventDefault();
  } else if(e.key==="Escape"){window.goSubject();e.preventDefault();}
});

// =============================================================
// INIT
// =============================================================
try{buildFavicon();}catch(e){}
try{
  render();
}catch(e){
  document.getElementById('app').innerHTML=
    '<div style="color:#fff;padding:30px;font-family:monospace;background:#1a0000;min-height:100vh">'+
    '<h2 style="color:#ff4444;margin-bottom:16px">❌ Erreur JS</h2>'+
    '<p style="color:#ffaaaa;font-size:13px;word-break:break-all">'+e.message+'</p>'+
    '<pre style="color:#ff8888;font-size:11px;margin-top:12px;white-space:pre-wrap">'+
    (e.stack||'no stack')+'</pre></div>';

}
</script>

</body>
</html>
