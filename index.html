<!DOCTYPE html>

<!-- v6 -->

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entraîneur">
<meta name="theme-color" content="#0D0D12">
<title>Entraîneur Partiel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#0D0D12}
body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#0D0D12;color:#F0EDE8;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

#root{height:100%;display:flex;justify-content:center;background:#0A0A10}
#app{width:100%;max-width:480px;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#0D0D12;position:relative;transition:opacity .18s ease,transform .18s ease}
#app.out{opacity:0;transform:translateX(12px)}
@media(min-width:520px){
#app{box-shadow:0 0 60px rgba(0,0,0,.8);border-left:1px solid #1E1E28;border-right:1px solid #1E1E28}
#app::-webkit-scrollbar{width:4px}
#app::-webkit-scrollbar-track{background:transparent}
#app::-webkit-scrollbar-thumb{background:#2E2E3E;border-radius:4px}
}

:root{
–bg:#0D0D12;–s1:#16161F;–s2:#1E1E28;–b1:#222230;–b2:#2E2E3E;
–t1:#F0EDE8;–t2:#C5C0D8;–t3:#7A7A9A;–t4:#44445A;
–gold:#C9A84C;–green:#2D9B6E;–red:#E0344A;
–grad:linear-gradient(135deg,#C9A84C,#E0B85C);
}

.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding:0 18px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7A7A9A}
.h1{font-size:26px;font-weight:800;color:#F0EDE8;line-height:1.15}
.h2{font-size:20px;font-weight:700;color:#F0EDE8}

.card{background:#16161F;border:1px solid #222230;border-radius:18px}
.card-sm{background:#16161F;border:1px solid #222230;border-radius:14px}

.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:700;letter-spacing:.2px;text-align:center;cursor:pointer;transition:transform .1s,opacity .15s;border:none}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:linear-gradient(135deg,#C9A84C,#E0B85C);color:#0D0D12;box-shadow:0 4px 20px rgba(201,168,76,.25)}
.btn-soft{background:#1E1E28;border:1px solid #2E2E3E;color:#F0EDE8}
.btn-ghost{background:transparent;border:1px solid #222230;color:#7A7A9A}
.btn-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:#7A7A9A;padding:8px 0;cursor:pointer;background:none;border:none}

.xp-track{height:6px;background:#1E1E28;border-radius:6px;overflow:hidden}
.xp-fill{height:100%;border-radius:6px;background:linear-gradient(135deg,#C9A84C,#E0B85C);transition:width 1.2s ease}
.progress-bar{height:3px;background:#1E1E28;border-radius:0;overflow:hidden}
.progress-fill{height:100%;background:#C9A84C;transition:width .5s ease}

.stats-row{display:flex;gap:8px}
.stat{flex:1;background:#16161F;border:1px solid #222230;border-radius:14px;padding:11px 6px;text-align:center}
.stat-n{font-size:18px;font-weight:800;color:#F0EDE8;margin-top:2px}
.stat-l{font-size:10px;font-weight:500;color:#7A7A9A;margin-top:2px;text-transform:uppercase;letter-spacing:.8px}

.sub-card{display:flex;align-items:center;gap:14px;background:#16161F;border:1px solid #222230;border-left-width:3px;border-radius:18px;padding:18px;cursor:pointer;transition:background .15s;text-align:left;width:100%}
.sub-card:active{background:#1E1E28}
.sub-icon{width:46px;height:46px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}

.opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px 14px;text-align:left;background:#16161F;border:1.5px solid #222230;border-radius:14px;cursor:pointer;transition:background .15s,border-color .15s}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.picked {background:#1E1E28;border-color:#C9A84C}
.opt.correct{background:#0D2B1E;border-color:#2D9B6E;cursor:default;animation:glow .8s ease}
.opt.wrong  {background:#2B0F14;border-color:#E0344A;cursor:default;animation:shake .4s ease}
.opt.faded  {opacity:.4;cursor:default}
.opt:disabled{cursor:default}
.opt-badge{width:26px;height:26px;flex-shrink:0;margin-top:1px;border-radius:50%;background:#1E1E28;border:1px solid #2E2E3E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#7A7A9A;transition:all .2s ease}
.opt.picked  .opt-badge{background:#C9A84C;border-color:#C9A84C;color:#0D0D12}
.opt.correct .opt-badge{background:#2D9B6E;border-color:#2D9B6E;color:#fff}
.opt.wrong   .opt-badge{background:#E0344A;border-color:#E0344A;color:#fff}
.opt-label{font-size:14px;line-height:1.5;color:#C5C0D8;flex:1}
.opt.picked  .opt-label{color:#F0EDE8}
.opt.correct .opt-label{color:#6EE7B7}
.opt.wrong   .opt-label{color:#FCA5A5}
.opt.faded   .opt-label{color:#44445A}

.expl{border-radius:14px;padding:15px 17px;animation:up .25s ease}
.expl.ok {background:#0D2B1E;border:1px solid #2D9B6E}
.expl.bad{background:#1A1428;border:1px solid #C9A84C}
.expl-title{font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.expl.ok  .expl-title{color:#6EE7B7}
.expl.bad .expl-title{color:#C9A84C}
.expl-body{font-size:13px;line-height:1.75;color:#C5C0D8}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;border:1px solid}
.badge{display:inline-flex;align-items:center;gap:6px;background:#16161F;border:1px solid #222230;border-radius:11px;padding:5px 11px;font-size:12px;font-weight:500;color:#F0EDE8;margin:3px}

.t-chip{display:flex;justify-content:space-between;align-items:center;background:#16161F;border:1.5px solid #222230;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;color:#F0EDE8;width:100%;text-align:left;cursor:pointer;transition:all .15s}
.d-chip{background:#16161F;border:1.5px solid #222230;border-radius:12px;padding:12px;text-align:left;width:100%;cursor:pointer;transition:border-color .15s}
.d-chip-label{font-size:13px;font-weight:700;color:#7A7A9A;transition:color .15s}
.d-chip-sub{font-size:11px;color:#44445A;margin-top:2px}
.n-chip{flex:1;padding:11px 6px;border-radius:11px;font-size:15px;font-weight:700;border:1.5px solid #222230;background:#16161F;color:#7A7A9A;cursor:pointer;transition:all .15s}

.ring-wrap{width:140px;height:140px;margin:0 auto 16px;position:relative}
.ring-wrap canvas{position:absolute;inset:0}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:34px;font-weight:800;color:#F0EDE8;line-height:1}
.ring-sub{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#7A7A9A;margin-top:2px}

.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.hist-box{flex-shrink:0;min-width:52px;background:#16161F;border:1px solid #222230;border-radius:12px;padding:9px 10px;text-align:center}
.hist-box.now{background:#1E1E28;border-color:#C9A84C}

.quiz-bar{background:#0D0D12;padding:12px 18px 0;position:sticky;top:0;z-index:50}
.quiz-bar-inner{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.quiz-cta{position:sticky;bottom:0;background:linear-gradient(180deg,transparent 0%,#0D0D12 25%,#0D0D12 100%);padding:24px 18px calc(16px + env(safe-area-inset-bottom));margin:0 -18px;z-index:40}

.soon{background:#16161F;border:1px dashed #222230;border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;opacity:.45}
.weak-btn{width:100%;background:#1A0E0E;border:1px solid rgba(224,52,74,.3);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left}
.stack{display:flex;flex-direction:column;gap:10px}
.kbd{display:none;font-size:10px;font-weight:700;color:#44445A;background:#1E1E28;border:1px solid #222230;border-radius:5px;padding:1px 6px;margin-left:auto;font-family:‘SF Mono’,Menlo,monospace}
@media(min-width:520px){.kbd{display:inline-block}}

.quiz-content{padding:14px 18px 8px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-4px)}30%,60%,90%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(45,155,110,0)}50%{box-shadow:0 0 0 6px rgba(45,155,110,.25)}}
</style>

</head>
<body>
<div id="root"><div id="app"><div style="color:#fff;padding:30px;font-family:sans-serif;background:#0D0D12;min-height:100vh"><h2>⏳ Chargement...</h2><p style="color:#888;margin-top:8px">Si ce message persiste, rechargez la page.</p></div></div></div>

<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('app');
  if(d)d.innerHTML='<div style="color:#fff;padding:24px;background:#1a0000;min-height:100vh;font-family:monospace">'
    +'<h2 style="color:#ff4444">❌ Erreur JS (line '+line+')</h2>'
    +'<p style="color:#ffaaaa;margin-top:12px;font-size:13px;word-break:break-all">'+msg+'</p>'
    +'<p style="color:#ff8888;margin-top:8px;font-size:11px">'+(err&&err.stack||'')+'</p></div>';
  return true;
};
</script>

<script>
// =============================================================
// QUESTIONS
// =============================================================
const ENT_Q=[
  {id:1,t:"ei",d:"f",q:"Quel principe fondamental la loi du 14 février 2022 a-t-elle instauré pour l'entreprise individuelle ?",o:["Obligation d'un capital social minimum","Séparation du patrimoine professionnel et personnel","Imposition obligatoire à l'IS","Publication annuelle des comptes"],a:1,e:"La loi du 14/02/2022 instaure la séparation du patrimoine pro et perso, supprime l'EIRL et ouvre l'option IS."},
  {id:2,t:"ei",d:"f",q:"Dans quelle catégorie fiscale sont imposés les bénéfices d'une activité libérale en EI ?",o:["BIC","BA","BNC","Traitements et salaires"],a:2,e:"BNC = Bénéfices Non Commerciaux pour les activités libérales. BIC pour le commercial/artisanal, BA pour l'agricole."},
  {id:3,t:"ei",d:"f",q:"L'entrepreneur individuel est-il obligé de publier ses comptes annuels ?",o:["Oui, chaque année","Non, pas de publication obligatoire","Oui, si CA > 100 000 €","Oui, mais uniquement le bilan"],a:1,e:"L'EI n'a pas l'obligation de publier ses comptes annuels, contrairement aux sociétés."},
  {id:4,t:"ei",d:"f",q:"À quel régime social est affilié l'entrepreneur individuel ?",o:["Régime général des salariés","Régime des artistes-auteurs","SSI – Sécurité Sociale des Indépendants (TNS)","MSA"],a:2,e:"L'entrepreneur individuel relève du régime TNS (Travailleurs Non-Salariés) géré par la SSI."},
  {id:5,t:"ei",d:"m",q:"Selon le barème IR 2026, quel taux s'applique entre 29 580 € et 84 577 € (1 part) ?",o:["11 %","20 %","30 %","41 %"],a:2,e:"Barème 2026 : 0% < 11 600€ / 11% de 11 601 à 29 579€ / 30% de 29 580 à 84 577€ / 41% de 84 578 à 181 917€ / 45% au-delà."},
  {id:6,t:"ei",d:"m",q:"Un couple sans enfant a un revenu net imposable de 63 000 €. Combien de parts fiscales ?",o:["1 part","1,5 part","2 parts","3 parts"],a:2,e:"Un couple marié ou pacsé sans enfant dispose de 2 parts (1 par personne)."},
  {id:7,t:"ei",d:"m",q:"Comment est imposé le bénéfice d'une entreprise individuelle ?",o:["Au niveau de l'entreprise séparément","Directement dans la déclaration de revenus de l'entrepreneur","Lors du versement de dividendes","Seulement si bénéfice > 10 000 €"],a:1,e:"L'EI n'a pas de personnalité morale. Le résultat est intégré directement à la déclaration IR de l'entrepreneur."},
  {id:8,t:"ei",d:"m",q:"Combien de parts représente un foyer : couple avec 3 enfants ?",o:["3 parts","3,5 parts","4 parts","5 parts"],a:2,e:"Couple = 2 parts + 1er enfant = ½ + 2e enfant = ½ + 3e enfant = 1 → total = 4 parts."},
  {id:9,t:"ei",d:"h",q:"Déficit de 10 000 €, conjoint perçoit 5 000 € de salaires. Revenu imposable du foyer ?",o:["15 000 €","10 000 €","0 € avec reliquat de 5 000 € reportable 6 ans","5 000 €"],a:2,e:"Le déficit (10 000€) s'impute sur le revenu global (5 000€). Revenu = 0. Reliquat de 5 000€ reportable sur N+1 à N+6."},
  {id:10,t:"ei",d:"h",q:"Les cotisations sociales TNS représentent quelle part du bénéfice ?",o:["Le CA","35 à 49 % du bénéfice avant impôt","Le bénéfice après impôt","Un forfait fixe"],a:1,e:"Les cotisations TNS = 35 à 49 % du bénéfice avant impôt. Des cotisations minimales sont dues même sans bénéfice."},
  {id:11,t:"ei",d:"h",q:"Excédent de déficit non absorbé par les revenus du foyer : que se passe-t-il ?",o:["Définitivement perdu","Reportable sur bénéfices 3 ans","Reportable sur revenu global des 6 années suivantes (N+1 à N+6)","Génère un crédit d'impôt"],a:2,e:"L'excédent de déficit peut être imputé sur le revenu global des 6 années suivantes (N+1 à N+6)."},
  {id:12,t:"ei",d:"f",q:"L'EI possède-t-elle une personnalité morale ?",o:["Oui, depuis 2022","Non, jamais","Oui, si capital > 1 000 €","Oui, après immatriculation"],a:1,e:"L'EI n'a jamais de personnalité morale. Seules les sociétés (SAS, SARL…) en ont une après immatriculation."},
  {id:13,t:"me",d:"f",q:"Seuil de CA annuel pour une micro-entreprise de prestations de services en 2026 ?",o:["77 700 €","83 600 €","188 700 €","203 100 €"],a:1,e:"Depuis le 1er janvier 2026 : 83 600 €/an pour les prestations de services et 203 100 €/an pour l'achat-revente."},
  {id:14,t:"me",d:"f",q:"Abattement forfaitaire pour un micro-entrepreneur exerçant une activité libérale (BNC) ?",o:["71 %","50 %","34 %","25 %"],a:2,e:"Abattements : 71 % achat-revente, 50 % prestations BIC, 34 % activités libérales BNC."},
  {id:15,t:"me",d:"f",q:"La déclaration de CA est-elle obligatoire si celui-ci est nul ?",o:["Non, inutile","Oui, toujours, sous peine de 52 € de pénalité","Oui, mais sans pénalité","Non, si inactif"],a:1,e:"La déclaration est toujours obligatoire. Pénalité de 52 € par déclaration manquante, même pour un CA de 0 €."},
  {id:16,t:"me",d:"f",q:"Mention obligatoire sur factures d'un micro-entrepreneur soumis à la franchise TVA ?",o:['"TVA récupérée à 20 %"','"TVA non applicable – Article 293 B du CGI"','"Exonéré de TVA – statut micro"','"TVA à régler par le client"'],a:1,e:'La mention "TVA non applicable – Article 293 B du CGI" est obligatoire. Le micro-entrepreneur ne facture ni ne récupère la TVA.'},
  {id:17,t:"me",d:"f",q:"Un micro-entrepreneur peut-il avoir deux micro-entreprises ?",o:["Oui, sans limite","Oui, max 2","Non, une seule par personne","Oui, si activités différentes"],a:2,e:"Une seule micro-entreprise par personne. Plusieurs activités peuvent coexister au sein de la même micro-entreprise."},
  {id:18,t:"me",d:"m",q:"Activité de conseil démarrée le 1er juillet 2026. Plafond de CA pour la première année ?",o:["83 600 €","41 800 €","77 700 €","101 550 €"],a:1,e:"Le seuil est proratisé : 6 mois sur 12 → 83 600 € ÷ 2 = 41 800 € pour les prestations de services."},
  {id:19,t:"me",d:"m",q:"Taux de cotisations sociales pour des prestations BIC (commerciales/artisanales) en 2025 ?",o:["12,3 %","21,2 %","24,6 %","23,2 %"],a:1,e:"Taux 2025 : 12,3 % achat-revente ; 21,2 % prestations BIC ; 24,6 % BNC libéraux ; 23,2 % libéraux réglementés CIPAV."},
  {id:20,t:"me",d:"m",q:"Seuil de base de la franchise TVA pour une activité commerciale ?",o:["83 600 €","77 700 €","85 000 €","93 500 €"],a:2,e:"Seuils TVA base : 85 000 € commercial, 37 500 € services. À distinguer des seuils micro-entreprise."},
  {id:21,t:"me",d:"m",q:"Taux du prélèvement libératoire IR pour les activités d'achat-revente ?",o:["2,2 %","1,7 %","1 %","0,5 %"],a:2,e:"Prélèvement libératoire : 1 % achat-revente, 1,7 % prestations artisanales/commerciales, 2,2 % autres BNC."},
  {id:22,t:"me",d:"m",q:"Depuis quand le compte bancaire dédié est-il obligatoire pour un micro-entrepreneur ?",o:["Dès la création","Dès le 1er euro","Si CA > 10 000 € pendant 2 années consécutives","Si CA dépasse le seuil TVA"],a:2,e:"Loi PACTE du 22/05/2019 : compte bancaire dédié obligatoire si CA > 10 000 € pendant 2 années consécutives."},
  {id:23,t:"me",d:"m",q:"Seuil majoré de franchise TVA pour les prestations de services ?",o:["37 500 €","41 250 €","83 600 €","85 000 €"],a:1,e:"Seuils TVA majorés : 93 500 € commercial, 41 250 € services. Au-delà du seuil majoré, TVA dès le 1er jour du mois."},
  {id:24,t:"me",d:"h",q:"CA commercial : 82 000 € en 2024, puis 90 500 € en 2025. Perte de franchise TVA en 2025 ?",o:["Oui, il dépasse 85 000 €","Non, car 2024 < 85 000 € ET 2025 < 93 500 €","Oui, dès janvier 2025","Non, car micro-entrepreneur"],a:1,e:"Franchise maintenue si : CA N-1 < seuil de base (82 000 < 85 000 ✓) ET CA N < seuil majoré (90 500 < 93 500 ✓)."},
  {id:25,t:"me",d:"h",q:"Condition de revenu pour opter pour le prélèvement libératoire de l'IR ?",o:["CA < 83 600 €","RFR ≤ 28 797 € par part","Bénéfice net < 20 000 €","Aucune condition"],a:1,e:"Le RFR du foyer ne doit pas dépasser 28 797 € par part de quotient familial pour pouvoir opter."},
  {id:26,t:"me",d:"h",q:"60 000 € de ventes de marchandises avec prélèvement libératoire. IR dû ?",o:["60 000 × 34 % = 20 400 €","60 000 × 1 % = 600 €","60 000 × 71 % × barème","60 000 × 1,7 % = 1 020 €"],a:1,e:"Pour l'achat-revente avec prélèvement libératoire : taux de 1 % du CA → 60 000 × 1 % = 600 €."},
  {id:27,t:"me",d:"h",q:"Parmi ces activités, laquelle est exclue du régime micro-entreprise ?",o:["Graphiste freelance","Développeur web","Expert-comptable libéral","Photographe freelance"],a:2,e:"Les professions libérales réglementées hors CIPAV sont exclues : avocat, médecin, expert-comptable."},
  {id:28,t:"me",d:"m",q:"Seuil CA 2026 pour l'achat-revente en micro-entreprise ?",o:["188 700 €","203 100 €","77 700 €","83 600 €"],a:1,e:"Seuils 2026-2028 : 203 100 €/an pour les activités d'achat-revente, vente à consommer sur place ou hébergement."},
  {id:29,t:"me",d:"m",q:"Réduction de cotisations sociales via l'ACRE la première année ?",o:["10 %","25 %","50 %","100 %"],a:1,e:"L'ACRE permet une exonération partielle de 25 % des cotisations sociales pendant la première année, sous conditions."},
  {id:30,t:"me",d:"f",q:"Le régime micro-entrepreneur est-il ouvert aux étudiants ?",o:["Non","Oui, explicitement ouvert aux étudiants","Oui, pour activités artistiques uniquement","Non, il faut avoir 18 ans et ne plus étudier"],a:1,e:"Le régime micro-entrepreneur est explicitement ouvert aux étudiants qui poursuivent leurs études."},
  {id:31,t:"aa",d:"f",q:"À quel organisme l'artiste-auteur s'affilie-t-il pour sa sécurité sociale ?",o:["URSSAF (TNS)","AGESSA et Maison des Artistes","Pôle Emploi","MSA"],a:1,e:"L'artiste-auteur s'affilie à l'AGESSA (auteurs) et à la Maison des Artistes (arts plastiques). Régime rattaché au régime général."},
  {id:32,t:"aa",d:"f",q:"L'artiste-auteur a-t-il accès aux allocations chômage ?",o:["Oui, comme tout travailleur","Non, ce régime n'y donne pas droit","Oui, via les intermittents","Oui, après 2 ans"],a:1,e:"Le régime artiste-auteur est rattaché au régime général pour la maladie, mais PAS accès au chômage ni aux AT des salariés."},
  {id:33,t:"aa",d:"f",q:"Quelle activité relève du régime des artistes-auteurs ?",o:["Mise à jour d'un site web","Création d'un jeu vidéo original","Dessin industriel et plans","Webmastering et admin de site"],a:1,e:"Un jeu vidéo original constitue une œuvre multimédia créative. Maintenance, plans techniques et webmastering sont exclus."},
  {id:34,t:"aa",d:"f",q:"Abattement en régime micro-BNC pour un artiste-auteur ?",o:["71 %","50 %","34 %","15 %"],a:2,e:"En micro-BNC, l'abattement forfaitaire est de 34 % sur les recettes déclarées."},
  {id:35,t:"aa",d:"m",q:"À partir de quel seuil de CA l'artiste-auteur est-il obligatoirement en déclaration contrôlée ?",o:["83 600 €","77 700 €","37 500 €","100 000 €"],a:1,e:"Si CA < 77 700 € : choix entre micro-BNC et déclaration contrôlée. Au-dessus : déclaration contrôlée obligatoire."},
  {id:36,t:"aa",d:"m",q:"Assiette sociale micro-BNC pour un artiste déclarant 10 000 € ?",o:["10 000 €","6 600 €","7 590 €","8 500 €"],a:2,e:"Assiette micro-BNC = recettes × (1 - 34 %) × 1,15 → 10 000 × 0,66 = 6 600 € × 1,15 = 7 590 €."},
  {id:37,t:"aa",d:"m",q:"Mois de paiement des cotisations sociales en BNC (déclaration contrôlée) ?",o:["Mensuellement","15 jan, 15 avr, 15 juil, 15 oct","Semestriellement","Une fois en mai"],a:1,e:"Cotisations versées trimestriellement : 15 janvier, 15 avril, 15 juillet et 15 octobre."},
  {id:38,t:"aa",d:"m",q:"Plafond annuel des activités accessoires relevant du régime artiste-auteur en 2024 ?",o:["5 000 €","10 000 €","13 980 €","20 000 €"],a:2,e:"En 2024, les revenus des activités accessoires (cours, ateliers…) ne doivent pas dépasser 13 980 € par an."},
  {id:39,t:"aa",d:"h",q:"Taux global des cotisations sociales d'un artiste-auteur ?",o:["21,2 %","24,6 %","16,2 %","35 %"],a:2,e:"Taux total 16,2 % : SS 0,40 %, retraite plafonnée 6,90 %, CSG 9,20 %, CRDS 0,50 %, CFP 0,35 %."},
  {id:40,t:"aa",d:"h",q:"Un salarié crée une œuvre dans le cadre de son contrat de travail : peut-il bénéficier du régime artiste-auteur ?",o:["Oui, automatiquement","Oui, s'il négocie une clause","Non, les salariés créant dans le cadre du travail en sont exclus","Oui, si l'œuvre est originale"],a:2,e:"Les auteurs salariés créant dans le cadre de leur travail sont exclus du régime artiste-auteur."},
  {id:41,t:"aa",d:"h",q:"Catégorie fiscale par défaut des revenus d'un artiste-auteur ?",o:["Traitements et salaires","BIC","BNC","BA"],a:2,e:"Les revenus relèvent des BNC par défaut. Ceux déclarés par tiers (éditeurs, SACEM…) peuvent être en T&S."},
  {id:42,t:"aa",d:"m",q:"Taux de CSG applicable aux revenus des artistes-auteurs ?",o:["7,5 %","9,2 %","6,8 %","17,2 %"],a:1,e:"La CSG est de 9,20 % dont 6,80 % sont déductibles fiscalement. Elle fait partie des 16,2 % de cotisations totales."},
  {id:43,t:"sc",d:"f",q:"Quel acte juridique donne naissance à une société et fixe ses règles ?",o:["Le procès-verbal d'AG","Les statuts","Le Kbis","La déclaration fiscale initiale"],a:1,e:"Les statuts créent la société. Ils fixent forme, capital, durée, objet, direction... L'immatriculation au RCS confère la personnalité morale."},
  {id:44,t:"sc",d:"f",q:"Taux normal de l'impôt sur les sociétés (IS) ?",o:["15 %","20 %","25 %","33,33 %"],a:2,e:"IS taux normal = 25 %. Taux réduit 15 % pour bénéfice < 42 500 € sous conditions (dont libération totale du capital)."},
  {id:45,t:"sc",d:"f",q:"Associé qui apporte ses compétences et savoir-faire : quel type d'apport ?",o:["Numéraire","Nature","Industrie","Mixte"],a:2,e:"Apport en industrie = compétences, savoir-faire, travail, notoriété. Ne constitue PAS le capital social, non transmissible."},
  {id:46,t:"sc",d:"f",q:"Différence principale de flexibilité entre SAS et SARL ?",o:["SAS a un capital minimum plus élevé","SAS réservée aux activités artistiques","SAS : grande liberté statutaire ; SARL : encadrée par le Code de commerce","SARL peut avoir des associés personnes morales, pas SAS"],a:2,e:"La SAS est très flexible (statuts libres, droits de vote différenciés...). La SARL est plus rigide car encadrée par le Code de commerce."},
  {id:47,t:"sc",d:"f",q:"Quel document prouve l'immatriculation d'une société au Registre du Commerce ?",o:["Les statuts signés","Le Kbis","L'acte de naissance","La déclaration URSSAF"],a:1,e:"Le Kbis (extrait du RCS) est le document officiel attestant de l'immatriculation et de l'existence légale de la société."},
  {id:48,t:"sc",d:"m",q:"M. A apporte 10 000 €, Mme B 6 000 € en matériel, M. C ses compétences (8 000 €). Capital social ?",o:["24 000 €","18 000 €","16 000 €","10 000 €"],a:2,e:"Capital = apports numéraire + nature = 10 000 + 6 000 = 16 000 €. L'apport en industrie de M. C ne constitue PAS le capital."},
  {id:49,t:"sc",d:"m",q:"Un gérant de SARL à 50 % du capital est-il majoritaire ?",o:["Oui, toujours","Non, il faut strictement plus de 50 % (50 % + 1 part)","Oui, si sa rémunération est la plus haute","Non, seulement à partir de 75 %"],a:1,e:"Le gérant est majoritaire s'il détient STRICTEMENT plus de 50 % (plus d'une part). À 50 %, il est égalitaire → régime général."},
  {id:50,t:"sc",d:"m",q:"Taux réduit d'IS pour les PME sur la fraction de bénéfice < 42 500 € ?",o:["10 %","15 %","20 %","25 %"],a:1,e:"Taux réduit IS = 15 % pour bénéfice < 42 500 €, sous conditions. Taux normal = 25 % au-delà."},
  {id:51,t:"sc",d:"m",q:"Régime social du président d'une SAS rémunéré ?",o:["TNS","Régime général (assimilé salarié)","Artistes-auteurs","Aucun régime"],a:1,e:"Le président de SAS rémunéré = régime général (assimilé salarié). Gérant majoritaire de SARL = TNS."},
  {id:52,t:"sc",d:"m",q:"PFU (Flat Tax) applicable aux dividendes depuis le 1er janvier 2026 ?",o:["30 % (12,8 IR + 17,2 % prélèvements)","31,4 % (12,8 IR + 18,6 % prélèvements)","25 % (IS uniquement)","15 % (taux réduit)"],a:1,e:"Loi de finances 2026 : PFU à 31,4 % = 12,8 % IR + 18,6 % prélèvements sociaux (était 30 % avant 2026)."},
  {id:53,t:"sc",d:"m",q:"Pourcentage des apports numéraires à libérer à la création en SAS ?",o:["10 %","20 %","50 %","100 %"],a:2,e:"SAS : 50 % des apports numéraires libérés à la création, reste en 5 ans. SARL : seulement 20 % à la création."},
  {id:54,t:"sc",d:"h",q:"Quand un gérant de SARL est-il « majoritaire » ?",o:["Seul > 50 % OU avec conjoint + enfants mineurs > 50 %","S'il dirige seul la société","Si salaire > 50 % des charges","Si nommé par la majorité"],a:0,e:"Gérant majoritaire : seul > 50 %, OU avec conjoint + enfants mineurs > 50 %, OU par société interposée > 50 %."},
  {id:55,t:"sc",d:"h",q:"Fraction des dividendes du gérant majoritaire SARL soumise aux cotisations TNS ?",o:["La totalité","La fraction > 10 % du (capital + compte courant d'associé)","La fraction > 50 % de sa rémunération","Aucune"],a:1,e:"Dividendes excédant 10 % du (capital + compte courant) → cotisations TNS (35-49 %). En dessous → PFU à 31,4 %."},
  {id:56,t:"sc",d:"h",q:"Dans quelles conditions une SAS à l'IS peut-elle opter pour l'IR ?",o:["Jamais","Sous conditions, max 5 ans","Toujours, sans limite","Si capital < 10 000 €"],a:1,e:"SAS et SARL peuvent opter pour l'IR sous conditions, pour maximum 5 ans. L'EURL est à l'IR par défaut."},
  {id:57,t:"sc",d:"h",q:"Régime TVA obligatoire si CA de prestations de services > 254 000 € HT ?",o:["Franchise en base","Régime simplifié","Régime réel normal","Régime forfaitaire"],a:2,e:"Régime réel normal obligatoire si CA > 840 000 € (commercial) ou > 254 000 € (services). Déclaration mensuelle de TVA."},
  {id:58,t:"sc",d:"h",q:"Conditions pour bénéficier de l'abattement de 40 % sur dividendes au barème IR ?",o:["Être gérant majoritaire","Dividendes décidés en AG + société française ou UE","CA < 10 M€ + capital libéré","Aucune condition"],a:1,e:"Abattement 40 % : (1) dividendes décidés en AG ET (2) société française ou siège en UE/pays avec accord fiscal."},
  {id:59,t:"sc",d:"m",q:"Durée maximale d'une société fixée dans les statuts ?",o:["50 ans","75 ans","99 ans","Illimitée"],a:2,e:"La durée est librement fixée par les associés, dans la limite légale de 99 ans. Elle peut être renouvelée."},
  {id:60,t:"sc",d:"m",q:"Quand un commissaire aux apports est-il obligatoire pour un apport en nature ?",o:["Toujours","Si apport > 30 000 € OU > 50 % du capital","Si apport > 10 000 €","Jamais"],a:1,e:"Commissaire aux apports obligatoire si apport en nature > 30 000 € OU si valeur totale des apports en nature > 50 % du capital."},
];

const DES_Q=[
  // DROIT D'AUTEUR
  {id:101,t:"da",d:"f",q:"Condition essentielle pour qu'une création graphique soit protégée par le droit d'auteur ?",o:["Avoir été déposée à l'INPI","Être originale (porter l'empreinte de la personnalité de l'auteur)","Avoir été publiée commercialement","Avoir été créée dans le cadre d'un contrat"],a:1,e:"Le droit d'auteur protège automatiquement toute œuvre originale dès sa création, sans dépôt ni formalité."},
  {id:102,t:"da",d:"f",q:"À partir de quand une œuvre est-elle protégée par le droit d'auteur ?",o:["Après dépôt à l'INPI","Après publication commerciale","Dès sa création, sans aucune formalité","Après enregistrement chez un notaire"],a:2,e:"En France, le droit d'auteur naît automatiquement à la création. Aucun dépôt requis, contrairement aux marques ou brevets."},
  {id:103,t:"da",d:"f",q:"Durée de protection du droit d'auteur en France ?",o:["50 ans après la mort de l'auteur","70 ans après la mort de l'auteur","99 ans à compter de la création","20 ans renouvelables"],a:1,e:"Le droit d'auteur est protégé pendant 70 ans après la mort de l'auteur. Après ce délai, l'œuvre tombe dans le domaine public."},
  {id:104,t:"da",d:"f",q:"Qu'est-ce qu'un droit moral d'auteur ?",o:["Le droit de percevoir une rémunération","Le droit inaliénable et perpétuel de l'auteur sur son œuvre (paternité, intégrité, divulgation, repentir)","Le droit de céder ses droits","Le droit de reproduire en nombre illimité"],a:1,e:"Le droit moral (paternité, intégrité, divulgation, repentir) est inaliénable et perpétuel. Il ne peut jamais être cédé."},
  {id:105,t:"da",d:"f",q:"Les droits moraux de l'auteur peuvent-ils être cédés ?",o:["Oui, comme tout droit","Oui, à une personne morale uniquement","Non, ils sont inaliénables et perpétuels","Oui, pour max 10 ans"],a:2,e:"Les droits moraux sont inaliénables : ils ne peuvent jamais être cédés, vendus ni abandonnés, même par contrat."},
  {id:106,t:"da",d:"m",q:"Qu'est-ce que le droit de reproduction d'un auteur ?",o:["Le droit d'obtenir une copie","Le droit exclusif d'autoriser toute fixation matérielle de l'œuvre (impression, numérique, photo…)","Le droit de représenter l'œuvre en public","Le droit de modifier l'œuvre"],a:1,e:"Le droit de reproduction est le droit exclusif d'autoriser toute fixation matérielle de l'œuvre. Il fait partie des droits patrimoniaux, cessibles."},
  {id:107,t:"da",d:"m",q:"Un client commande une identité visuelle à un designer freelance. Qui détient les droits d'auteur ?",o:["Le client, car il a payé","Le designer, sauf cession expresse par contrat","Les deux co-auteurs à parts égales","L'INPI"],a:1,e:"Dans une œuvre de commande, le créateur freelance conserve ses droits d'auteur. Le client ne reçoit que les droits expressément cédés par contrat."},
  {id:108,t:"da",d:"m",q:"Qu'est-ce qu'une œuvre de collaboration ?",o:["Œuvre créée sous la direction d'une entreprise","Œuvre créée conjointement par plusieurs auteurs, droits gérés en commun","Œuvre créée pour un client professionnel","Œuvre financée par plusieurs personnes"],a:1,e:"L'œuvre de collaboration est créée par plusieurs auteurs ensemble. Droits en indivision. Décisions d'exploitation à l'unanimité."},
  {id:109,t:"da",d:"m",q:"Exception légale permettant de reproduire un extrait d'œuvre sans autorisation ?",o:["Si l'œuvre est sur Internet","Courte citation à titre d'analyse ou de critique, avec mention de la source","Si usage commercial rentable","Si l'œuvre date de plus de 10 ans"],a:1,e:"L'exception de courte citation permet un extrait à des fins d'analyse, d'enseignement ou de critique, avec mention obligatoire de la source."},
  {id:110,t:"da",d:"m",q:"Qu'est-ce que le 'droit de suite' pour un artiste ?",o:["Le droit de poursuivre en justice","Le droit de percevoir un % sur les reventes aux enchères de ses œuvres originales","Le droit de suivre l'utilisation de l'œuvre","Le droit à une suite de l'œuvre"],a:1,e:"Le droit de suite = % (0,25 à 4 %) sur le prix de revente aux enchères publiques. Il est inaliénable."},
  {id:111,t:"da",d:"h",q:"Salarié qui crée un logo pendant son temps de travail : qui détient les droits ?",o:["Automatiquement l'employeur","Au salarié, avec licence implicite employeur","Au salarié, SAUF logiciels ou clause de cession dans le contrat de travail","À l'employeur s'il a donné des instructions précises"],a:2,e:"En France, le salarié reste auteur et titulaire des droits, SAUF pour les logiciels (cédés à l'employeur de plein droit). Pour les autres œuvres, une clause de cession est nécessaire."},
  {id:112,t:"da",d:"h",q:"Qu'est-ce qu'une œuvre collective ?",o:["Toute œuvre créée à plusieurs","Œuvre créée sur initiative et sous direction d'une personne (souvent morale) qui la divulgue sous son nom","Œuvre financée par des fonds publics","Œuvre créée lors d'un hackathon"],a:1,e:"L'œuvre collective est créée sous direction d'une personne qui coordonne les contributions et divulgue l'œuvre sous son nom. Ex : encyclopédies, journaux, sites web d'entreprises."},
  {id:113,t:"da",d:"h",q:"Un festival utilise l'affiche d'un designer pour un documentaire non prévu au contrat. Quel principe protège l'auteur ?",o:["Le droit de suite","Le principe de spécialité : la cession couvre seulement les usages expressément mentionnés","Le droit de retrait","L'exception de copie privée"],a:1,e:"Le principe de spécialité : toute cession de droits doit préciser les droits, durée, territoire et support. Tout usage non prévu nécessite une nouvelle autorisation."},
  {id:114,t:"da",d:"m",q:"Qu'est-ce que le domaine public en droit d'auteur ?",o:["Les œuvres appartenant à l'État","Les œuvres librement utilisables car protection expirée (70 ans après mort de l'auteur)","Les œuvres publiées gratuitement","Les œuvres non déposées à l'INPI"],a:1,e:"Une œuvre tombe dans le domaine public 70 ans après la mort de l'auteur. Attention : les droits moraux (paternité, intégrité) demeurent."},
  {id:115,t:"da",d:"m",q:"L'exception de parodie permet-elle de détourner une œuvre sans autorisation ?",o:["Non, toute utilisation requiert l'accord de l'auteur","Oui, à condition que la parodie soit clairement identifiable et ne crée pas de confusion","Oui, mais uniquement à des fins non commerciales","Non, sauf accord écrit"],a:1,e:"L'exception de parodie permet un détournement sans autorisation si la parodie est reconnaissable comme telle et ne porte pas atteinte à la réputation de l'auteur."},
  // MARQUES
  {id:116,t:"ma",d:"f",q:"Durée de protection d'une marque déposée à l'INPI ?",o:["5 ans renouvelables","10 ans renouvelables indéfiniment","20 ans non renouvelables","70 ans après mort du créateur"],a:1,e:"Marque INPI : 10 ans renouvelables indéfiniment, à condition de payer les redevances et d'exploiter la marque."},
  {id:117,t:"ma",d:"f",q:"Quelle organisation gère les dépôts de marques en France ?",o:["La Chambre de Commerce","L'INPI","Le greffe du tribunal","La DGCCRF"],a:1,e:"L'INPI gère en France les marques, brevets, dessins et modèles. Pour une protection européenne : EUIPO."},
  {id:118,t:"ma",d:"f",q:"Un signe purement descriptif du produit peut-il être déposé comme marque ?",o:["Oui, sans restriction","Non, il ne peut constituer une marque valide","Oui, avec un logo","Oui, en langue étrangère"],a:1,e:"Un signe descriptif est refusé à l'enregistrement. Une marque doit être distinctive et ne pas décrire directement le produit."},
  {id:119,t:"ma",d:"m",q:"Qu'est-ce que la 'règle de spécialité' d'une marque ?",o:["La marque ne protège que dans un pays","La protection ne vaut que pour les classes de produits/services enregistrées","La marque doit être utilisée exactement telle que déposée","La marque ne peut être utilisée que par une entité"],a:1,e:"La règle de spécialité : une marque est protégée uniquement pour les classes déclarées lors du dépôt (45 classes de Nice)."},
  {id:120,t:"ma",d:"m",q:"Qu'est-ce que la déchéance d'une marque ?",o:["L'expiration à 10 ans","Perte des droits si la marque n'est pas exploitée pendant 5 ans consécutifs","Annulation d'une marque similaire antérieure","Refus lors du dépôt"],a:1,e:"Déchéance : si la marque n'est pas exploitée pendant 5 ans consécutifs sans juste motif, tout concurrent peut en demander la déchéance."},
  {id:121,t:"ma",d:"m",q:"Comment protéger une marque dans tous les pays de l'UE en une démarche ?",o:["Dépôt INPI avec extension UE","Dépôt d'une marque de l'UE auprès de l'EUIPO","Dépôt dans chaque pays séparément","Dépôt auprès de l'OMPI pour l'Europe"],a:1,e:"La marque de l'UE est déposée auprès de l'EUIPO à Alicante. Protection dans les 27 États membres en un seul dépôt."},
  {id:122,t:"ma",d:"m",q:"Un designer crée un logo ressemblant à une marque déposée. Quel risque principal ?",o:["Aucun si non identique","Action en contrefaçon ou concurrence déloyale par le titulaire de la marque","Amende administrative INPI","Simple avertissement"],a:1,e:"Un logo similaire à une marque déposée expose à une action en contrefaçon ou concurrence déloyale. D'où l'importance de rechercher les antériorités."},
  {id:123,t:"ma",d:"h",q:"Différences entre protection par droit d'auteur et droit des marques pour un logo ?",o:["Identiques","DA : automatique, 70 ans post-mortem, pas de dépôt. Marque : dépôt obligatoire, 10 ans renouvelables, protection par secteur","DA : dépôt INPI obligatoire. Marque : automatique","DA : 20 ans. Marque : illimitée sans dépôt"],a:1,e:"Droit d'auteur : automatique, 70 ans post-mortem, pas de dépôt. Marque : dépôt INPI obligatoire, 10 ans, protection par classes. Un logo peut cumuler les deux."},
  {id:124,t:"ma",d:"h",q:"Qu'est-ce qu'une marque notoire et quelle protection spéciale lui est accordée ?",o:["Une marque très ancienne","Une marque connue d'une large fraction du public, protégée même hors de ses classes d'enregistrement","Une marque déposée dans plus de 50 pays","Une marque approuvée par l'État"],a:1,e:"La marque notoire (Apple, Nike…) bénéficie d'une protection étendue hors de ses classes d'enregistrement."},
  // DESSINS & MODÈLES
  {id:125,t:"dm",d:"f",q:"Qu'est-ce qu'un dessin ou modèle au sens juridique ?",o:["Un plan technique de bâtiment","L'apparence esthétique d'un produit (lignes, couleurs, formes, texture, ornements)","Une illustration publiée","Un logotype d'entreprise"],a:1,e:"Un dessin ou modèle protège l'apparence visuelle d'un produit : forme, lignes, couleurs, texture, ornements. Ex : meuble, emballage, textile."},
  {id:126,t:"dm",d:"f",q:"Durée maximale de protection d'un dessin ou modèle déposé ?",o:["10 ans","20 ans","25 ans","70 ans"],a:2,e:"Protection de 5 ans renouvelables jusqu'à 25 ans maximum. À l'expiration, le design entre dans le domaine public."},
  {id:127,t:"dm",d:"m",q:"Deux conditions pour qu'un dessin ou modèle soit protégeable par dépôt ?",o:["Originalité et ancienneté","Nouveauté et caractère propre (impression visuelle globale différente)","Dépôt et paiement de redevances","Utilisation commerciale et publication"],a:1,e:"Conditions : (1) Nouveauté (aucun design identique antérieurement divulgué) et (2) Caractère propre (impression visuelle différente des designs antérieurs)."},
  {id:128,t:"dm",d:"m",q:"Le design communautaire non enregistré offre-t-il une protection ?",o:["Non, seul le dépôt INPI protège","Oui, 3 ans de protection automatique dès la première divulgation en Europe","Oui, 5 ans automatiquement","Non, sans dépôt aucune protection"],a:1,e:"Le DMCNE (Dessin ou Modèle Communautaire Non Enregistré) offre 3 ans de protection automatique dès la première divulgation publique en UE."},
  {id:129,t:"dm",d:"m",q:"Présentation d'un concept à un salon avant dépôt : peut-on encore déposer le design ?",o:["Non, la divulgation détruit la nouveauté","Oui, les salons pro sont confidentiels","Oui, délai de grâce de 12 mois après divulgation pour déposer","Oui, si aucune photo n'a été prise"],a:2,e:"Délai de grâce européen de 12 mois : une divulgation par l'auteur dans l'année précédant le dépôt ne détruit pas la nouveauté."},
  {id:130,t:"dm",d:"h",q:"Différence entre protection par droit d'auteur et dessin/modèle pour un objet de design ?",o:["Identiques","DA : automatique, originalité, 70 ans post-mortem. DM : dépôt, nouveauté + caractère propre, 25 ans max. Peuvent se cumuler.","DA : 25 ans. DM : 70 ans","DA : pour 2D uniquement. DM : pour 3D uniquement"],a:1,e:"Un objet de design peut cumuler DA (original, automatique, 70 ans) ET dessin/modèle (nouveau + caractère propre, dépôt, 25 ans). Théorie de l'unité de l'art en France."},
  // CONTRATS
  {id:131,t:"ct",d:"f",q:"Qu'est-ce qu'une cession de droits d'auteur ?",o:["Un emprunt temporaire des droits","Un transfert définitif et contractuel des droits patrimoniaux vers un cessionnaire","Un partage des droits","Une autorisation verbale"],a:1,e:"La cession de droits est un transfert DÉFINITIF des droits patrimoniaux de l'auteur vers un tiers, contre rémunération. Obligatoirement écrite."},
  {id:132,t:"ct",d:"f",q:"Qu'est-ce qu'une licence d'utilisation ?",o:["Un certificat officiel d'exercice","Une autorisation d'utiliser une œuvre selon des conditions définies, sans transfert de propriété","Un contrat de travail créatif","Un document INPI attestant d'un dépôt"],a:1,e:"La licence autorise l'utilisation de l'œuvre selon des conditions précises (durée, territoire, supports, usage). L'auteur reste propriétaire de ses droits."},
  {id:133,t:"ct",d:"m",q:"La cession de droits d'auteur doit-elle être écrite ?",o:["Non, un accord oral suffit","Oui, écrite et précisant : droits cédés, durée, territoire, mode d'exploitation et rémunération","Non, sauf montants > 1 500 €","Oui, uniquement pour les cessions totales"],a:1,e:"La cession doit OBLIGATOIREMENT être écrite (art. L131-3 CPI) et préciser : droits cédés, durée, territoire, mode d'exploitation et rémunération."},
  {id:134,t:"ct",d:"m",q:"Principe de spécialité en matière de cession de droits ?",o:["Chaque contrat ne couvre qu'un type de création","La cession est limitée aux droits et usages expressément mentionnés","Le contrat ne vaut que pour une seule utilisation","La cession ne vaut que dans un pays"],a:1,e:"Principe de spécialité (art. L131-3 CPI) : les droits non expressément cédés restent chez l'auteur. Les contrats vagues s'interprètent en faveur de l'auteur."},
  {id:135,t:"ct",d:"m",q:"Sans contrat de cession, le client peut-il utiliser une affiche pour un autre projet ?",o:["Oui, car il a payé le designer","Non, seul l'usage convenu est autorisé","Oui, si usage similaire","Oui, la commande implique une cession complète"],a:1,e:"Sans cession de droits, le client n'a qu'une licence implicite pour l'usage convenu. Tout autre usage est non autorisé."},
  {id:136,t:"ct",d:"h",q:"Dans un contrat de commande, le client acquiert-il automatiquement tous les droits d'auteur car il finance l'œuvre ?",o:["Oui, le financement transfère les droits","Non, l'auteur freelance conserve ses droits sauf cession expresse. Paiement ≠ transfert de droits.","Oui, si la commande > 1 000 €","Cela dépend de la nature de l'œuvre"],a:1,e:"Dans un contrat de commande, l'auteur (freelance) CONSERVE ses droits d'auteur. Paiement de la commande ≠ cession de droits. Principe fondamental du droit français."},
  {id:137,t:"ct",d:"h",q:"Que doit préciser un contrat de cession selon le Code de la Propriété Intellectuelle ?",o:["Uniquement le prix","Les droits cédés, la durée, le territoire, la destination et la rémunération","Nom de l'auteur et date de création","Le numéro SIRET des deux parties"],a:1,e:"Art. L131-3 CPI : la cession doit préciser les droits cédés, la durée, le territoire, la destination (usage prévu) et la rémunération. Toute mention absente = droit non cédé."},
  // CONTREFAÇON
  {id:138,t:"cf",d:"f",q:"Qu'est-ce que la contrefaçon en propriété intellectuelle ?",o:["Imitation d'un produit de luxe","Toute atteinte aux droits de PI : reproduction ou utilisation non autorisée d'une œuvre, marque, brevet ou dessin protégé","Vente de produits défectueux","Copie d'un style artistique"],a:1,e:"La contrefaçon = toute violation d'un droit de PI : copie d'œuvre (DA), imitation de marque, usage non autorisé d'un brevet ou dessin/modèle."},
  {id:139,t:"cf",d:"m",q:"Sanction pénale maximale pour contrefaçon en France ?",o:["1 an et 100 000 € d'amende","3 ans et 300 000 € d'amende","10 ans et 1 M€","5 ans et 500 000 €"],a:1,e:"Contrefaçon : délit pénal puni de 3 ans et 300 000 € (art. L335-2 CPI). Peine aggravée (5 ans, 500 000 €) : bande organisée, Internet, travail dissimulé."},
  {id:140,t:"cf",d:"m",q:"S'inspirer fortement du style d'un créateur sans copier son œuvre exacte : est-ce de la contrefaçon ?",o:["Oui, s'inspirer d'un style est toujours contrefaçon","Non, le style n'est pas protégeable ; seul l'emprunt d'éléments originaux spécifiques peut constituer contrefaçon","Oui, si même secteur","Non, liberté artistique totale"],a:1,e:"Le style artistique n'est pas protégé par le droit d'auteur. Seules les œuvres concrètes originales le sont. S'inspirer = légal. Reproduire des éléments formels originaux = contrefaçon potentielle."},
  {id:141,t:"cf",d:"m",q:"Comment prouver la date de création d'une œuvre pour se défendre contre une accusation de plagiat ?",o:["Seul un dépôt à l'INPI fait foi","Par tout moyen : enveloppe Soleau, huissier, plateforme horodatée, e-coffre-fort","Par témoignage de l'auteur","Par la date de publication sur les réseaux sociaux"],a:1,e:"Preuve de date par tout moyen : enveloppe Soleau (INPI), dépôt huissier, société d'auteurs (SACD, SCAM) ou plateformes horodatées. Le dépôt n'est pas obligatoire mais la preuve de date est cruciale."},
  {id:142,t:"cf",d:"h",q:"Différence entre contrefaçon et plagiat ?",o:["Termes juridiquement identiques","Plagiat = terme moral (appropriation sans citation). Contrefaçon = terme juridique (atteinte à un droit PI). Le plagiat peut constituer une contrefaçon.","Contrefaçon : marques uniquement. Plagiat : littérature uniquement","Plagiat : pénal. Contrefaçon : civil"],a:1,e:"Plagiat = concept moral/académique. Contrefaçon = terme juridique. Le plagiat d'une œuvre protégée peut constituer une contrefaçon."},
  {id:143,t:"cf",d:"f",q:"Une image trouvée sur Google Images est-elle libre de droits ?",o:["Oui, tout sur Internet est libre","Non, les images sont protégées par le droit d'auteur sauf mention contraire","Oui, si non filigranée","Oui, pour usage non commercial"],a:1,e:"Les images sur Internet sont protégées dès leur création. Il faut vérifier la licence ou utiliser des banques d'images libres (Creative Commons, Unsplash…)."},
  {id:144,t:"cf",d:"h",q:"Qu'est-ce qu'une action en saisie-contrefaçon ?",o:["Une procédure pénale d'arrestation","Une procédure civile permettant de faire saisir par huissier les preuves et produits contrefaisants, avant tout procès","Une amende administrative de l'INPI","Un recours douanier uniquement"],a:1,e:"La saisie-contrefaçon : procédure préventive puissante. Le titulaire de droits obtient d'un juge l'autorisation de faire constater par huissier les preuves de contrefaçon avant le procès."},
  {id:145,t:"da",d:"m",q:"Une photo d'un monument public est-elle protégée par le droit d'auteur ?",o:["Non, les photos amateurs ne sont pas protégées","Oui, si elle présente des choix esthétiques originaux (cadrage, lumière, angle) portant l'empreinte du photographe","Non, les monuments publics sont dans le domaine public","Oui, automatiquement toute photographie"],a:1,e:"Une photo est protégée si elle est originale (choix esthétiques propres à l'auteur). Une simple photo documentaire sans choix créatif ne sera pas forcément protégée."},
  {id:146,t:"ma",d:"f",q:"Combien de classes existent dans le classement international de Nice pour les marques ?",o:["10 classes","25 classes","45 classes","100 classes"],a:2,e:"Le classement de Nice comprend 45 classes : 34 classes de produits et 11 classes de services."},
  {id:147,t:"dm",d:"f",q:"Où dépose-t-on un dessin ou modèle pour une protection en France ?",o:["Greffe du tribunal de commerce","À l'INPI","Chambre de Commerce","À la DGCCRF"],a:1,e:"Les dessins et modèles sont déposés à l'INPI pour une protection en France, ou à l'EUIPO pour une protection européenne."},
  {id:148,t:"ct",d:"h",q:"Qu'est-ce que la rémunération proportionnelle en droit d'auteur ?",o:["Toujours obligatoire sur le CA global","En principe obligatoire pour les cessions, calculée sur les recettes d'exploitation. Forfait possible dans des cas limitativement prévus.","Jamais obligatoire","Obligatoire uniquement pour la publicité"],a:1,e:"Art. L131-4 CPI : la cession doit être rémunérée proportionnellement aux recettes d'exploitation. Le forfait n'est possible que dans des cas limitativement prévus (logiciel, usage difficile à déterminer…)."},
  {id:149,t:"da",d:"m",q:"Qu'est-ce que le droit de divulgation de l'auteur ?",o:["Le droit de publier sur les réseaux","Le droit exclusif de décider si, quand et comment son œuvre sera communiquée au public pour la première fois","Le droit d'informer les médias","Le droit de déposer l'œuvre à l'INPI"],a:1,e:"Le droit de divulgation (droit moral) : l'auteur seul décide si et quand son œuvre est rendue publique pour la première fois."},
  {id:150,t:"cf",d:"m",q:"Qu'est-ce que l'exception de copie privée ?",o:["Toute personne peut reproduire une œuvre pour son usage personnel strictement, sans autorisation","Toute copie entre amis est autorisée","Les entreprises peuvent copier des œuvres pour usage interne","La copie privée n'existe pas en droit français"],a:0,e:"L'exception de copie privée : toute personne peut reproduire une œuvre protégée pour son usage personnel et privé. Elle est compensée par la redevance copie privée prélevée sur les supports vierges."},
];

const UX_Q=[
  // ─── LOIS & PRINCIPES (10) ───────────────────────────────────────
  {id:201,t:"lo",d:"f",
   q:"Selon la loi de Fitts, quel est le facteur clé qui réduit le temps nécessaire pour atteindre une cible avec un curseur ou un doigt ?",
   o:["La couleur de la cible doit contraster fortement avec son fond","La taille de la cible et sa proximité avec la position de départ du curseur","Le nombre d'éléments présents autour de la cible","La complexité visuelle de l'interface dans laquelle elle se trouve"],
   a:1,e:"La loi de Fitts (1954) énonce que le temps pour atteindre une cible est fonction de sa distance ET de sa taille. Plus la cible est grande et proche, plus l'interaction est rapide. C'est pour ça que les boutons d'action principale sont gros et placés dans la thumb zone sur mobile."},

  {id:202,t:"lo",d:"f",
   q:"La loi de Hick-Hyman concerne le temps de décision face à plusieurs choix. Que stipule-t-elle exactement ?",
   o:["Le temps de décision croît linéairement avec le nombre d'options","Le temps de décision croît de manière logarithmique avec le nombre d'options","Le temps de décision est constant quel que soit le nombre d'options","Le temps de décision décroît avec le nombre d'options proposées"],
   a:1,e:"La loi de Hick-Hyman (1952) : le temps de décision est proportionnel au log2 du nombre d'options. Doubler le nombre de choix n'ajoute qu'une unité de temps, pas le double. Cela justifie de simplifier les menus, mais aussi de ne pas tomber dans la sur-simplification au détriment de la rapidité d'accès."},

  {id:203,t:"lo",d:"f",
   q:"Le psychologue George A. Miller a publié en 1956 un article célèbre sur la mémoire de travail humaine. Combien d'éléments un utilisateur peut-il retenir simultanément selon ses observations ?",
   o:["3 éléments en moyenne","5 éléments, sans variation possible","7 plus ou moins 2 éléments (5 à 9)","12 éléments, comme une horloge"],
   a:2,e:"L'article 'The Magical Number Seven, Plus or Minus Two' (Miller, 1956) établit que la mémoire de travail peut retenir 7±2 unités d'information. Cette limite a influencé la conception de menus, mais des recherches récentes (Cowan) suggèrent une limite plus stricte de 4±1 chunks réellement actifs."},

  {id:204,t:"lo",d:"m",
   q:"La loi de Jakob, énoncée par Jakob Nielsen, stipule que les utilisateurs passent la majorité de leur temps sur d'autres sites que le vôtre. Quelle conséquence pratique en tirer en tant que designer ?",
   o:["Il faut radicalement innover dans l'interface pour se démarquer de la concurrence","Il faut respecter les conventions de design établies pour que les utilisateurs naviguent intuitivement","Il faut copier exactement le site leader du marché","Il faut tester chaque interface auprès de tous les concurrents"],
   a:1,e:"La loi de Jakob (2000) : les utilisateurs ont des attentes formées par les sites populaires (Google, Amazon, Apple). Respecter ces conventions (logo en haut à gauche cliquable vers l'accueil, panier en haut à droite, etc.) réduit la charge cognitive. L'innovation doit être ciblée, pas systématique."},

  {id:205,t:"lo",d:"m",
   q:"L'effet von Restorff, ou effet d'isolation, est mobilisé en design pour attirer l'attention sur un élément. En quoi consiste-t-il précisément ?",
   o:["Un élément aligné avec les autres est mieux mémorisé","Un élément qui se distingue visuellement de son environnement est mieux mémorisé","Un élément placé en haut de page est toujours mieux retenu","Un élément avec beaucoup de texte est plus facile à retrouver"],
   a:1,e:"L'effet von Restorff (1933) : un élément qui se distingue par sa couleur, sa forme, sa taille ou son emplacement est mémorisé plus facilement. Application : un seul bouton d'action principale (CTA) coloré au milieu de boutons secondaires gris attire automatiquement le regard."},

  {id:206,t:"lo",d:"m",
   q:"La loi de Pareto, transposée à l'UX, est souvent appelée règle 80/20. Comment se traduit-elle dans l'analyse des fonctionnalités d'un produit ?",
   o:["80% des bugs proviennent de 20% du code","80% des utilisateurs utilisent 20% des fonctionnalités","80% du temps de développement est consacré à 20% de l'interface","80% des conversions ont lieu sur 20% des écrans"],
   a:1,e:"La règle 80/20 en UX : 80% des utilisateurs utilisent surtout 20% des fonctionnalités. C'est pourquoi il faut prioriser et mettre en avant ces fonctionnalités cruciales, et envisager de masquer ou supprimer les autres pour réduire la complexité (loi de Tesler / conservation de la complexité)."},

  {id:207,t:"lo",d:"m",
   q:"La loi de Doherty (1982) relative au temps de réponse d'une interface fixe un seuil critique pour maintenir l'engagement de l'utilisateur. Quel est ce seuil de référence ?",
   o:["100 millisecondes maximum","400 millisecondes maximum","1 seconde maximum","3 secondes maximum"],
   a:1,e:"La loi de Doherty : un temps de réponse inférieur à 400 ms maintient l'utilisateur dans un état de productivité optimal (le 'flow'). Au-delà, il y a perte de focus, frustration et abandon. C'est pour ça que les apps utilisent des skeleton screens, des animations de chargement, des optimistic updates..."},

  {id:208,t:"lo",d:"h",
   q:"Le principe de Tesler, ou loi de conservation de la complexité, énonce un principe fondamental sur la complexité d'un système. Lequel ?",
   o:["Toute complexité peut être réduite à zéro avec un design suffisamment intelligent","Tout système possède une complexité incompressible : la question est de savoir qui prend en charge cette complexité (l'utilisateur ou le système)","La complexité est toujours du côté de l'utilisateur, pas du système","La complexité d'une interface est proportionnelle au nombre de ses utilisateurs"],
   a:1,e:"Larry Tesler (créateur du copier-coller) : tout système comporte une complexité minimale incompressible. Le designer choisit qui la porte. Exemple : la mise en forme automatique d'une adresse postale décharge l'utilisateur, mais demande plus de travail au système. Mauvais design = complexité reportée sur l'utilisateur."},

  {id:209,t:"lo",d:"h",
   q:"L'effet d'esthétique-utilisabilité (Aesthetic-Usability Effect) a été démontré par les chercheurs japonais Kurosu et Kashimura en 1995. Que dit-il ?",
   o:["Les interfaces les plus utilisables sont systématiquement perçues comme les plus belles","Les interfaces perçues comme esthétiques sont jugées plus faciles à utiliser, même quand ce n'est pas objectivement le cas","L'esthétique d'une interface n'a aucun lien avec sa perception d'utilisabilité","Plus une interface est esthétique, plus elle ralentit l'utilisateur"],
   a:1,e:"Kurosu & Kashimura ont testé deux distributeurs identiques fonctionnellement, l'un plus joli que l'autre. Les utilisateurs ont jugé le 'beau' plus facile à utiliser. L'esthétique crée une indulgence cognitive face aux frictions, mais ne remplace pas une bonne UX : c'est un complément, pas un substitut."},

  {id:210,t:"lo",d:"h",
   q:"L'effet de gradient du but (Goal Gradient Effect) est notamment utilisé dans les programmes de fidélité, les barres de progression et les onboardings. En quoi consiste cet effet psychologique ?",
   o:["Plus un utilisateur s'approche du but, plus son engagement et sa motivation augmentent","Plus un utilisateur a déjà progressé, plus il a tendance à abandonner","Le but doit être présenté de manière dégradée pour ne pas décourager","Les utilisateurs préfèrent les buts vagues aux buts précis"],
   a:1,e:"Hull (1932), confirmé par Kivetz et al. (2006) : la motivation s'accroît à mesure qu'on approche du but. Application : barres de progression d'inscription, cartes de fidélité 'pré-tamponnées' (10 cases dont 2 déjà cochées), pourcentages de complétion de profil. Effet plus fort quand la fin est visible."},

  // ─── HEURISTIQUES NIELSEN (10) ───────────────────────────────────
  {id:211,t:"he",d:"f",
   q:"Les 10 heuristiques de Jakob Nielsen sont la référence en évaluation experte d'interface. Combien y en a-t-il exactement, et de quand datent-elles dans leur version actuelle ?",
   o:["8 heuristiques, datant de 1990","10 heuristiques, dont la version révisée date de 2020","12 heuristiques, datant de 2010","15 heuristiques, datant de 2015"],
   a:1,e:"Nielsen a publié sa première liste en 1994, révisée en 2020 (les libellés changent légèrement, le fond reste). Les 10 heuristiques : visibilité du système, correspondance avec le monde réel, contrôle utilisateur, cohérence/standards, prévention des erreurs, reconnaissance plutôt que rappel, flexibilité, esthétique minimaliste, gestion des erreurs, aide et documentation."},

  {id:212,t:"he",d:"f",
   q:"Une application affiche en permanence un indicateur de chargement, le statut de la connexion réseau, et confirme chaque action de l'utilisateur. Quelle heuristique de Nielsen cela illustre-t-il principalement ?",
   o:["Visibilité de l'état du système","Cohérence et standards","Esthétique et design minimaliste","Reconnaissance plutôt que rappel"],
   a:0,e:"H1 - Visibilité de l'état du système : le système doit toujours tenir l'utilisateur informé de ce qui se passe, via un retour approprié dans un délai raisonnable. Exemples : barres de progression, badges de notifications, état 'en ligne/hors ligne', confirmation après envoi d'un formulaire."},

  {id:213,t:"he",d:"f",
   q:"Une app de gestion utilise des icônes de dossier et de poubelle, ainsi que des termes comme 'Acheter', 'Panier', 'Commander'. Quelle heuristique de Nielsen est appliquée ici ?",
   o:["Visibilité de l'état du système","Correspondance entre le système et le monde réel","Aide à la reconnaissance des erreurs","Liberté et contrôle de l'utilisateur"],
   a:1,e:"H2 - Correspondance avec le monde réel : utiliser le langage et les conventions familières aux utilisateurs (mots, phrases, métaphores visuelles). Une 'corbeille' parle plus qu'un 'gestionnaire de fichiers supprimés'. Le vocabulaire métier doit primer sur le jargon technique."},

  {id:214,t:"he",d:"m",
   q:"Un utilisateur clique par erreur sur 'Supprimer mon compte', mais une fenêtre lui propose 'Annuler' ou 'Confirmer'. Une option 'Restaurer mon compte' est aussi disponible pendant 30 jours. Quelle heuristique de Nielsen est ici en jeu ?",
   o:["Reconnaissance plutôt que rappel","Liberté et contrôle de l'utilisateur (issues de secours, undo/redo)","Esthétique et design minimaliste","Aide et documentation"],
   a:1,e:"H3 - Liberté et contrôle de l'utilisateur : prévoir des 'issues de secours' (undo/redo, annulation, sortie clairement marquée). Les utilisateurs effectuent souvent des actions par erreur et doivent pouvoir revenir en arrière sans pénalité. Exemples : Cmd+Z, suppression réversible, fenêtre de confirmation."},

  {id:215,t:"he",d:"m",
   q:"Une boutique en ligne place sa barre de recherche en haut à droite, son logo cliquable en haut à gauche, et utilise une icône de panier 🛒 dans le header. Quelle heuristique de Nielsen est appliquée ?",
   o:["Cohérence et standards (respect des conventions)","Visibilité de l'état du système","Liberté et contrôle de l'utilisateur","Aide et documentation"],
   a:0,e:"H4 - Cohérence et standards : les utilisateurs ne devraient pas se demander si différents mots, situations ou actions signifient la même chose. Suivre les conventions de la plateforme (Material, Apple HIG) et de l'industrie. Cohérence interne (entre écrans du produit) ET externe (avec les autres produits)."},

  {id:216,t:"he",d:"m",
   q:"Un formulaire empêche d'entrer des lettres dans un champ 'téléphone', affiche un astérisque rouge sur les champs obligatoires, et désactive le bouton 'Envoyer' tant que des erreurs subsistent. Quelle heuristique de Nielsen est principalement mobilisée ?",
   o:["Esthétique et design minimaliste","Prévention des erreurs","Reconnaissance plutôt que rappel","Aide et documentation"],
   a:1,e:"H5 - Prévention des erreurs : un design qui empêche les erreurs de survenir vaut mieux qu'un bon message d'erreur. Deux formes : éliminer les conditions propices (champ contraint), ou présenter une option de confirmation avant l'action critique. Inline validation, contraintes de format, valeurs par défaut intelligentes."},

  {id:217,t:"he",d:"m",
   q:"Une app de cuisine affiche en permanence l'étape en cours, montre les ingrédients déjà utilisés, et propose des sélecteurs visuels (sliders, dropdowns avec icônes) plutôt que des champs texte vides. Quelle heuristique cela illustre-t-il ?",
   o:["Cohérence et standards","Reconnaissance plutôt que rappel","Liberté et contrôle de l'utilisateur","Visibilité de l'état du système"],
   a:1,e:"H6 - Reconnaissance plutôt que rappel : minimiser la charge mémorielle de l'utilisateur en rendant les objets, actions et options visibles. Reconnaître est plus facile que se rappeler. Exemples : autocomplétion, historique de recherche, breadcrumbs, dropdowns avec preview, recently used."},

  {id:218,t:"he",d:"h",
   q:"Une app cible à la fois les débutants (mode tutoriel guidé) et les experts (raccourcis clavier, automatisations, scripts). Quelle heuristique de Nielsen cela illustre-t-il ?",
   o:["Aide à la reconnaissance et au diagnostic des erreurs","Flexibilité et efficacité d'utilisation","Esthétique et design minimaliste","Visibilité de l'état du système"],
   a:1,e:"H7 - Flexibilité et efficacité d'utilisation : les accélérateurs (raccourcis clavier, gestures, macros) peuvent invisiblement accélérer le travail des experts, sans gêner les novices. Le système doit accommoder ces deux profils. Exemples : Cmd+K pour command palette, swipe pour archiver, customisation."},

  {id:219,t:"he",d:"h",
   q:"Un message d'erreur indique : 'Erreur 0x80004005 : opération échouée'. Quelle heuristique de Nielsen est principalement violée, et comment la corriger ?",
   o:["H6 (Reconnaissance) - il faudrait remplacer le code par une icône","H9 (Aide à reconnaître, diagnostiquer et corriger les erreurs) - le message doit être en langage clair, indiquer le problème ET proposer une solution constructive","H10 (Aide et documentation) - il faut juste ajouter un lien vers la doc","H1 (Visibilité du système) - il manque un indicateur de progression"],
   a:1,e:"H9 - Aide à la reconnaissance, au diagnostic et à la correction des erreurs : les messages doivent être en langage clair (pas de codes), indiquer précisément le problème, et suggérer une solution constructive. 'Connexion impossible. Vérifiez votre connexion internet et réessayez. [Réessayer]' est mille fois meilleur."},

  {id:220,t:"he",d:"h",
   q:"Vous concevez une app de gestion de projet complexe. L'utilisateur doit pouvoir trouver de l'aide rapidement sans quitter son contexte de travail. Quelle heuristique cibler, et avec quelles solutions concrètes ?",
   o:["H8 - Esthétique : ajouter des illustrations explicatives sur chaque écran","H10 - Aide et documentation : prévoir une aide contextuelle, recherchable, axée sur les tâches de l'utilisateur (tooltips, FAQ inline, walkthroughs ciblés)","H4 - Cohérence : copier la documentation d'un concurrent","H7 - Flexibilité : laisser l'utilisateur écrire sa propre doc"],
   a:1,e:"H10 - Aide et documentation : même si le système devrait pouvoir être utilisé sans documentation, il peut être nécessaire d'en fournir. L'aide doit être facile à chercher, axée sur la tâche de l'utilisateur, lister des étapes concrètes et ne pas être trop volumineuse. Idéal : aide contextuelle inline (tooltips, walkthroughs)."},

  // ─── GESTALT (10) ────────────────────────────────────────────────
  {id:221,t:"ge",d:"f",
   q:"Quelle loi de la Gestalt est principalement illustrée par cette image, où des éléments rapprochés sont perçus comme un même groupe ?",
   img:"gestaltProximity",
   o:["La loi de similarité","La loi de proximité","La loi de continuité","La loi de fermeture"],
   a:1,e:"Loi de proximité : les éléments visuellement proches les uns des autres sont perçus comme appartenant au même groupe. Application UX : grouper les champs liés d'un formulaire, espacer les sections, regrouper les actions associées dans une toolbar. C'est souvent plus puissant que d'ajouter des cadres."},

  {id:222,t:"ge",d:"f",
   q:"Quelle loi de la Gestalt est principalement illustrée ici, où les éléments partageant la même forme ou couleur sont perçus comme appartenant au même groupe ?",
   img:"gestaltSimilarity",
   o:["La loi de similarité","La loi de proximité","La loi du destin commun","La loi de symétrie"],
   a:0,e:"Loi de similarité : les éléments qui partagent une caractéristique visuelle commune (forme, couleur, taille, orientation) sont perçus comme un groupe. Application UX : tous les liens dans une couleur unique, boutons primaires de la même couleur, icônes du même style. Utilisée pour créer une cohérence visuelle."},

  {id:223,t:"ge",d:"f",
   q:"Quelle loi de la Gestalt est illustrée ici par notre tendance à percevoir un cercle là où il n'y a en réalité qu'une suite de pointillés ?",
   img:"gestaltClosure",
   o:["La loi de proximité","La loi de continuité","La loi de fermeture","La loi de figure-fond"],
   a:2,e:"Loi de fermeture : notre cerveau complète mentalement les formes incomplètes pour percevoir une figure entière. Application UX : logos minimalistes (Apple, IBM), icônes en lignes pointillées, économie visuelle. Permet de simplifier les éléments graphiques sans perdre la lisibilité."},

  {id:224,t:"ge",d:"m",
   q:"Vous concevez un dashboard avec 12 widgets de données. Vous décidez de les regrouper par catégorie en augmentant l'espacement entre les groupes plutôt qu'en ajoutant des bordures ou des fonds colorés. Quelle loi de Gestalt exploitez-vous ?",
   o:["La loi de similarité","La loi de proximité","La loi de fermeture","La loi de symétrie"],
   a:1,e:"La loi de proximité est l'outil le plus économique pour structurer une interface : elle fonctionne sans ajouter de poids visuel (bordures, fonds, séparateurs). Augmenter l'espacement entre les groupes par rapport à l'espacement intra-groupe suffit à créer la perception de groupes distincts. C'est la base du 'white space' efficace."},

  {id:225,t:"ge",d:"m",
   q:"Une page d'inscription utilise des bordures arrondies, des champs alignés verticalement, et des labels au-dessus des champs. Tous les éléments suivent une 'colonne' visuelle invisible. Quelle loi de Gestalt est principalement à l'œuvre ?",
   o:["La loi de proximité","La loi de continuité (les éléments alignés sont perçus comme liés)","La loi de fermeture","La loi du destin commun"],
   a:1,e:"Loi de continuité : l'œil suit naturellement les lignes et les courbes, et perçoit les éléments alignés comme liés. Application : aligner les champs d'un formulaire crée une 'colonne visuelle' qui guide le regard. Les ruptures d'alignement créent du chaos visuel et fatiguent l'utilisateur."},

  {id:226,t:"ge",d:"m",
   q:"Sur un site, lorsqu'un menu déroulant apparaît avec une animation d'ouverture, tous ses éléments apparaissent simultanément avec le même mouvement. Quelle loi de Gestalt est exploitée ?",
   o:["La loi de proximité","La loi du destin commun (Common Fate)","La loi de fermeture","La loi de symétrie"],
   a:1,e:"Loi du destin commun : des éléments qui bougent ou changent ensemble sont perçus comme liés. Application UX : animations groupées d'apparition de menus, scroll parallaxe synchronisé, indicateur d'écriture dans une messagerie ('John est en train d'écrire...'). Très puissant en motion design."},

  {id:227,t:"ge",d:"m",
   q:"Vous regardez le célèbre logo du WWF (panda noir et blanc). Quel principe de Gestalt explique notre capacité à percevoir l'animal alors qu'aucune ligne ne dessine son contour complet ?",
   o:["La loi de fermeture","La loi de figure-fond","La loi de continuité","La loi de proximité"],
   a:1,e:"Loi de figure-fond : notre cerveau distingue automatiquement un objet (la figure) de son arrière-plan (le fond). Le logo WWF joue avec ce principe (le blanc devient figure quand on regarde la silhouette du panda). Application UX : design minimaliste, dark mode, cartes flottantes."},

  {id:228,t:"ge",d:"h",
   q:"Vous redesignez un formulaire avec 20 champs. Vous avez le choix entre : (A) ajouter des bordures colorées autour de chaque section, (B) utiliser uniquement l'espacement et l'alignement, ou (C) numéroter chaque champ. Quelle approche est la plus alignée avec les principes Gestalt et la charge cognitive ?",
   o:["A : les bordures colorées attirent l'attention et clarifient les sections","B : l'espacement et l'alignement (proximité + continuité) suffisent à créer la structure sans surcharger visuellement","C : la numérotation est la plus claire pour l'utilisateur","Aucune des trois - il faut absolument utiliser des onglets"],
   a:1,e:"Combiner proximité (espacement entre sections > espacement intra-section) et continuité (alignement vertical) crée une structure perceptive sans ajouter de poids visuel. Les bordures multiplient les éléments à traiter et augmentent la charge cognitive (loi de Hick et Miller). Le 'white space' est un outil de design, pas du vide."},

  {id:229,t:"ge",d:"h",
   q:"La loi de la région commune (Common Region) est une extension récente des principes Gestalt. En quoi consiste-t-elle, et quelle est son application UX la plus courante ?",
   o:["Les éléments dans une même zone délimitée (carte, panneau coloré) sont perçus comme un groupe — c'est la base des cartes (cards) et panels en UI","Tous les éléments d'une page partagent par défaut la même région","La région commune désigne uniquement la zone visible (above the fold)","C'est un synonyme de la loi de figure-fond"],
   a:0,e:"Loi de la région commune (Palmer, 1992) : les éléments perçus comme étant à l'intérieur d'une même région ou frontière (cadre, fond coloré, carte) sont perçus comme groupés. C'est la base des composants 'card' en UI moderne. Plus puissante que la proximité quand on veut un regroupement très explicite."},

  {id:230,t:"ge",d:"h",
   q:"Pourquoi est-il généralement déconseillé de mélanger plusieurs principes Gestalt contradictoires sur un même écran (par exemple : proximité forte mais similarité opposée des couleurs) ?",
   o:["Cela crée des conflits perceptifs et augmente la charge cognitive : l'utilisateur ne sait plus quels éléments sont liés","C'est au contraire recommandé pour créer du dynamisme visuel","Les principes Gestalt ne sont pas censés interagir entre eux","Cela ne pose un problème que pour les utilisateurs daltoniens"],
   a:0,e:"Les principes Gestalt s'additionnent quand ils sont alignés (cohérence) et créent des conflits perceptifs quand ils sont contradictoires. Exemple : 4 boutons rapprochés (proximité = groupés) mais de couleurs très différentes (similarité = pas groupés) → perception ambiguë. La règle : aligner les signaux Gestalt vers la même perception."},

  // ─── MÉTHODES DE RECHERCHE (10) ──────────────────────────────────
  {id:231,t:"me",d:"f",
   q:"Quelle est la différence fondamentale entre un test utilisateur modéré et un test utilisateur non modéré ?",
   o:["Le modéré coûte moins cher car il est automatisé","Le modéré implique un facilitateur en direct (en personne ou visio) qui guide la session ; le non modéré est asynchrone et automatisé via une plateforme","Le non modéré dure toujours plus longtemps","Le modéré ne peut être réalisé qu'en présentiel"],
   a:1,e:"Modéré (UserTesting Live, en présentiel) : un facilitateur guide en direct, peut poser des questions, observer en temps réel - riche mais coûteux. Non modéré (Maze, Lookback async) : l'utilisateur fait le test seul, à son rythme - plus scalable et moins cher, mais moins de profondeur. Choix selon les objectifs et le budget."},

  {id:232,t:"me",d:"f",
   q:"Combien d'utilisateurs faut-il typiquement recruter pour un test utilisateur qualitatif efficace selon les recherches de Nielsen et Landauer (1993) ?",
   o:["3 utilisateurs suffisent toujours","5 utilisateurs permettent de détecter environ 85% des problèmes d'usabilité","20 utilisateurs minimum pour avoir des résultats fiables","Au moins 100 utilisateurs pour la rigueur statistique"],
   a:1,e:"Selon Nielsen & Landauer (1993) : 5 utilisateurs détectent ~85% des problèmes d'usabilité, à diminishing returns au-delà. Mieux vaut faire 3 cycles de 5 tests qu'un seul de 15 (test → fix → retest). Pour des données quantitatives (taux de succès, temps), il faut 20+ participants par segment."},

  {id:233,t:"me",d:"f",
   q:"Vous voulez savoir quelle version de votre page d'accueil convertit le mieux. Quelle méthode est la plus appropriée ?",
   o:["Un test utilisateur modéré avec 5 personnes","Un A/B test sur le trafic réel du site","Un card sorting","Une analyse heuristique"],
   a:1,e:"A/B test : deux versions diffusées simultanément à des segments aléatoires, comparées sur une métrique précise (taux de conversion, clic, temps). Donne des résultats statistiquement fiables sur de gros volumes. Limite : ne dit pas POURQUOI la version gagnante gagne — il faut combiner avec du qualitatif."},

  {id:234,t:"me",d:"m",
   q:"Vous souhaitez restructurer la navigation d'un grand site e-commerce. Vous voulez comprendre comment les utilisateurs catégorisent mentalement vos produits. Quelle méthode est la plus pertinente ?",
   o:["Un test A/B des différents menus","Un card sorting (ouvert ou fermé) avec des utilisateurs cibles","Une analyse de heatmap sur le menu actuel","Un guerilla testing dans un café"],
   a:1,e:"Card sorting : on donne aux participants des cartes (produits, fonctionnalités) et on leur demande de les regrouper. Ouvert (sans catégories prédéfinies) révèle leurs modèles mentaux ; fermé (catégories imposées) valide une structure. Tree testing complète en validant la trouvabilité dans une nav existante."},

  {id:235,t:"me",d:"m",
   q:"Vous validez la structure de navigation d'un site une fois définie. Vous voulez savoir si vos utilisateurs trouveront facilement une fonctionnalité. Quelle méthode utiliser ?",
   o:["Un eye tracking en laboratoire","Un tree testing (Treejack, OptimalSort)","Une analyse SUS","Un sondage en ligne"],
   a:1,e:"Tree testing : on présente la structure de navigation 'nue' (sans design, juste l'arborescence textuelle) et on demande aux participants de trouver telle ou telle fonctionnalité. Mesure la trouvabilité indépendamment du design visuel. Excellent complément du card sorting (qui crée la structure, le tree testing la valide)."},

  {id:236,t:"me",d:"m",
   q:"Une persona, telle que définie par Alan Cooper, doit refléter une représentation fictionnelle mais ancrée. Quelle est l'erreur la plus courante dans la création de personas ?",
   o:["Inclure une photo et un prénom (cela rend la persona trop fictive)","Créer des personas basées sur des stéréotypes ou des suppositions plutôt que sur des données issues d'entretiens utilisateurs réels","Limiter le nombre de personas à 3 ou 4","Définir des objectifs précis pour chaque persona"],
   a:1,e:"Erreur classique : créer des personas 'au doigt mouillé' basées sur des suppositions de l'équipe ou du marketing. Une persona doit être issue d'au moins 5-15 entretiens utilisateurs (saturation des thèmes), avec données comportementales (objectifs, pain points, contexte d'usage), pas démographiques ('Marie, 35 ans, mère de deux enfants')."},

  {id:237,t:"me",d:"m",
   q:"Une carte d'expérience (User Journey Map) typique se compose de plusieurs niveaux. Lesquels sont essentiels ?",
   o:["Phases (étapes du parcours) + actions + pensées + émotions + opportunités d'amélioration","Uniquement les actions de l'utilisateur, en ordre chronologique","Une simple liste de fonctionnalités du produit","Le persona et son CV"],
   a:0,e:"User Journey Map : (1) phases du parcours (de la prise de conscience à la fidélisation), (2) actions concrètes de l'utilisateur, (3) pensées/questions, (4) courbe émotionnelle, (5) points de contact, (6) opportunités d'amélioration. Permet de visualiser l'expérience complète et d'identifier les frictions."},

  {id:238,t:"me",d:"h",
   q:"L'évaluation heuristique est une méthode rapide d'évaluation experte d'interface. Combien d'évaluateurs faut-il idéalement pour identifier la majorité des problèmes selon Nielsen ?",
   o:["1 évaluateur expert suffit dans tous les cas","3 à 5 évaluateurs experts indépendants ; un seul détecte environ 35% des problèmes, 5 en détectent ~75%","Au moins 10 évaluateurs pour être rigoureux","Le nombre n'a aucune influence sur les résultats"],
   a:1,e:"Selon Nielsen, 3 à 5 évaluateurs experts indépendants identifient ~75% des problèmes. Un seul évaluateur ne détecte que ~35% (effet de confirmation). Chaque évaluateur passe l'interface au crible des 10 heuristiques individuellement, puis les résultats sont consolidés. Méthode rapide et pas chère, complémentaire des tests utilisateurs."},

  {id:239,t:"me",d:"h",
   q:"Quelle est la différence fondamentale entre une interview utilisateur et un test utilisateur ?",
   o:["Les deux sont identiques, seul le nom change","L'interview pose des questions sur les attitudes, opinions, contextes ; le test observe les comportements réels en situation d'utilisation","L'interview se fait en présentiel, le test toujours à distance","Le test ne fournit que des données quantitatives, l'interview que des données qualitatives"],
   a:1,e:"Distinction clé : 'What people SAY vs what people DO'. L'interview révèle les attitudes, motivations, contexte de vie - mais les utilisateurs sont peu fiables sur leurs propres comportements. Le test observe les comportements réels en situation. Les deux sont complémentaires : interviews pour comprendre, tests pour valider."},

  {id:240,t:"me",d:"h",
   q:"Le cadre HEART, développé par Google, est un framework d'évaluation UX quantitative. Que représentent les 5 lettres de cet acronyme ?",
   o:["Honest, Empathic, Accurate, Reliable, Tested","Happiness, Engagement, Adoption, Retention, Task success","Heuristic, Empirical, Analytical, Robust, Tested","Hierarchy, Equity, Aesthetic, Reach, Trust"],
